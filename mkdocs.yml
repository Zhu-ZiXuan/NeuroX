site_name: NeuroX Documentation
site_description: A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models
site_author: Zhu-Zixuan
repo_url: https://github.com/Zhu-Zixuan/NeuroX
repo_name: Zhu-Zixuan/NeuroX
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [neurox]
          options:
            docstring_style: google
            members_order: alphabetical
            show_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: false
            show_category_heading: true

# Navigation mirrors the on-disk ``docs/`` layout.
# - ``dev/``: long-lived cross-cutting documentation (architecture rules and ADRs).
# - ``modules/``: per-module design notes mirroring the ``neurox/`` source tree; the
#   developer's primary entry point.
# - ``user/``: end-user guides (currently only ``examples.md``; the rest of the
#   user docs are still TODO).
nav:
  - Development:
      - Overview: dev/README.md
      - Roadmap: dev/roadmap.md
      - Architecture:
          - Overview: dev/architecture/README.md
          - Code Style: dev/architecture/code_style.md
          - Config and Construction: dev/architecture/config_and_construction.md
          - Fabrication Lifecycle: dev/architecture/fabrication_lifecycle.md
          - State Holding: dev/architecture/state_holding.md
          - Mapping: dev/architecture/mapping.md
      - ADR:
          - Overview: dev/adr/README.md
          - "ADR-0001 Config dispatch and owned construction": dev/adr/ADR-0001-config-dispatch-and-owned-construction.md
          - "ADR-0002 NMOS is a pure electrical primitive": dev/adr/ADR-0002-nmos-is-a-pure-electrical-primitive.md
  - Modules:
      - Overview: modules/README.md
      - common:
          - Overview: modules/common/README.md
          - config: modules/common/config.md
          - registry_dispatch: modules/common/registry_dispatch.md
          - load_dump: modules/common/load_dump.md
          - nonideality: modules/common/nonideality.md
          - physical_constant: modules/common/physical_constant.md
          - quant: modules/common/quant.md
      - device:
          - Overview: modules/device/README.md
          - nmos: modules/device/nmos.md
          - rram: modules/device/rram.md
          - wire: modules/device/wire.md
          - selector: modules/device/selector.md
      - analog:
          - Overview: modules/analog/README.md
          - clamp_driver: modules/analog/clamp_driver.md
          - analog_mux: modules/analog/analog_mux.md
          - decoder: modules/analog/decoder.md
          - driver: modules/analog/driver.md
          - switch_cap: modules/analog/switch_cap.md
          - dac:
              - Overview: modules/analog/dac/README.md
              - base: modules/analog/dac/base.md
              - general: modules/analog/dac/general.md
          - adc:
              - Overview: modules/analog/adc/README.md
              - base: modules/analog/adc/base.md
              - general: modules/analog/adc/general.md
              - mcs_sar: modules/analog/adc/mcs_sar.md
              - sar_mono: modules/analog/adc/sar_mono.md
          - tia:
              - Overview: modules/analog/tia/README.md
              - base: modules/analog/tia/base.md
              - opamp_tia: modules/analog/tia/opamp_tia.md
      - digital:
          - Overview: modules/digital/README.md
      - xbar:
          - Overview: modules/xbar/README.md
          - base: modules/xbar/base.md
          - ideal: modules/xbar/ideal.md
          - solver: modules/xbar/solver.md
          - 1T1R:
              - Overview: modules/xbar/_1t1r/README.md
              - circuit_core: modules/xbar/_1t1r/circuit_core.md
              - newton_raphson_solver: modules/xbar/_1t1r/newton_raphson_solver.md
              - offset: modules/xbar/_1t1r/offset.md
              - differential: modules/xbar/_1t1r/differential.md
              - simple_core: modules/xbar/_1t1r/simple_core.md
          - readout:
              - Overview: modules/xbar/readout/README.md
              - base: modules/xbar/readout/base.md
              - offset_switchcap_mux_adc: modules/xbar/readout/offset_switchcap_mux_adc.md
      - mapper:
          - Overview: modules/mapper/README.md
          - transcoder: modules/mapper/transcoder.md
          - xbar:
              - Overview: modules/mapper/xbar/README.md
              - base: modules/mapper/xbar/base.md
              - simple_mapper: modules/mapper/xbar/simple_mapper.md
              - slicer: modules/mapper/xbar/slicer/README.md
              - tiler: modules/mapper/xbar/tiler/README.md
      - macro:
          - Overview: modules/macro/README.md
      - operator:
          - Overview: modules/operator/README.md
          - train: modules/operator/train/README.md
      - profiler:
          - Overview: modules/profiler/README.md
      - replace:
          - Overview: modules/replace/README.md
      - tools:
          - Overview: modules/tools/README.md
          - calculate_1t1r_states: modules/tools/calculate_1t1r_states.md
          - logging: modules/tools/logging.md
          - xbar_adc:
              - Overview: modules/tools/xbar_adc/README.md
              - statistic: modules/tools/xbar_adc/statistic.md
              - calibrate: modules/tools/xbar_adc/calibrate.md
  - User Guide:
      - Examples: user/examples.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css
