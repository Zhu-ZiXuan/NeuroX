site_name: NeuroX Documentation
site_description: A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models
site_author: Zhu-Zixuan
repo_url: https://github.com/Zhu-Zixuan/NeuroX
repo_name: Zhu-Zixuan/NeuroX
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [neurox]
          options:
            docstring_style: google # use google style docstrings
            members_order: alphabetical # order members alphabetically
            show_signature: true # show function/method signatures
            show_signature_annotations: true # show type annotations in signatures
            show_source: false # do not show source code
            show_root_heading: false # do not show root heading
            show_category_heading: true # show category headings

nav:
  - Home: index.md
  - User Guide:
      - Installation: user/installation.md
      - Quick Start: user/quickstart.md
      - Examples (LeNet, BERT): user/examples.md
      - FAQ: user/faq.md
  - Design:
      - Architecture: design/architecture.md
      - Hardware-Aware Training: design/hat_training.md
      - 1T1R Circuit Solver: design/solver_1t1r.md
      - API Interfaces: design/api_interfaces.md
      - Reference Analysis: design/reference_analysis.md
  - Development:
      - Contributing: ../CONTRIBUTING.md
      - Environment Setup: development/env_setup.md
      - Testing Guide: development/testing_guide.md
      - Debugging Tips: development/debugging_tips.md
      - Release Process: development/release_process.md
      - Roadmap: development/roadmap.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css
