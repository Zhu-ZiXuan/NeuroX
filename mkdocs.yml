site_name: NeuroX Documentation
site_description: A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models
site_author: Zhu-Zixuan
repo_url: https://github.com/Zhu-Zixuan/NeuroX
repo_name: Zhu-Zixuan/NeuroX
edit_uri: edit/main/docs/

# Under --strict, a dead cross-reference fragment (#anchor) aborts the build, not just a missing file.
validation:
  omitted_files: warn
  anchors: warn
  absolute_links: warn
  unrecognized_links: warn

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [neurox]
          options:
            docstring_style: google
            members_order: alphabetical
            show_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: false
            show_category_heading: true

# Top-level sections follow the reader journey in docs/README.md; within a
# section, the README comes first and a family precedes its members.
nav:
- Home: README.md
- Get started:
  - Overview: get_started/README.md
- Guides:
  - Overview: guides/README.md
  - Algorithm engineer:
    - Overview: guides/algorithm_engineer/README.md
    - Workflow: guides/algorithm_engineer/workflow.md
  - Calibration:
    - Overview: guides/calibration/README.md
    - ADC input characterization: guides/calibration/calibrate_adc.md
    - Macro calibration: guides/calibration/calibrate_macro.md
    - Cell linearization and solver contract: guides/calibration/solver_tolerances.md
    - Tool conventions: guides/calibration/tool_conventions.md
- Reference:
  - Overview: reference/README.md
  - Architecture:
    - Unit:
      - Family: reference/architecture/unit/family.md
      - CIM:
        - Matrix mapping:
          - Family: reference/architecture/mapping/family.md
          - Input activation: reference/architecture/mapping/input_activation.md
          - Placement: reference/architecture/mapping/placement.md
          - Weight slicing: reference/architecture/mapping/weight_slice.md
          - Input slicing: reference/architecture/mapping/x_slice.md
      - Conv2d mapping: reference/architecture/unit/conv2d.md
  - Primitive:
    - Analog:
      - Single-ended current ADC:
        - Family: reference/primitive/analog/current_adc/family.md
        - SAR: reference/primitive/analog/current_adc/sar.md
      - Current DAC:
        - Family: reference/primitive/analog/current_dac/family.md
        - General: reference/primitive/analog/current_dac/general.md
      - Current mux: reference/primitive/analog/current_mux.md
      - Reference source: reference/primitive/analog/reference.md
      - Differential voltage ADC:
        - Family: reference/primitive/analog/diff_voltage_adc/family.md
        - MCS SAR: reference/primitive/analog/diff_voltage_adc/mcs_sar.md
      - Switch cap: reference/primitive/analog/switch_cap.md
      - Unmodeled block: reference/primitive/analog/unmodeled.md
      - Voltage DAC:
        - Family: reference/primitive/analog/voltage_dac/family.md
        - General: reference/primitive/analog/voltage_dac/general.md
      - Voltage driver: reference/primitive/analog/voltage_driver.md
      - Voltage mux: reference/primitive/analog/voltage_mux.md
    - Device:
      - MOSFET: reference/primitive/device/mosfet.md
      - RRAM: reference/primitive/device/rram.md
      - Selector: reference/primitive/device/selector.md
    - Digital:
      - Accumulator: reference/primitive/digital/accumulator.md
      - Adder: reference/primitive/digital/adder.md
      - Serial accumulator: reference/primitive/digital/serial_accumulator.md
      - Shift adder: reference/primitive/digital/shift_adder.md
      - Subtractor: reference/primitive/digital/subtractor.md
    - Macro:
      - CIM:
        - Family: reference/primitive/macro/cim/family.md
        - Ideal: reference/primitive/macro/cim/ideal.md
    - Nonideality: reference/primitive/nonideality.md
    - Physics: reference/primitive/physics.md
    - Xbar:
      - Array:
        - Family: reference/primitive/xbar/array/family.md
        - 1T1R:
          - Array: reference/primitive/xbar/array/1t1r.md
      - Cell:
        - Family: reference/primitive/xbar/cell/family.md
        - 1T1R:
          - Family: reference/primitive/xbar/cell/1t1r.md
          - Detail: reference/primitive/xbar/cell/1t1r_detail.md
          - Linear: reference/primitive/xbar/cell/1t1r_linear.md
      - Solver:
        - Parallel BL/SL: reference/primitive/xbar/solver/col_bl_col_sl.md
- Validation:
  - Overview: validation/README.md
  - Campaigns: validation/campaigns.md
  - Adaptive solve validation: validation/structured_while_solve.md
- API:
  - Overview: api/README.md
  - Configuration: api/configuration.md
  - Python: api/python.md
  - Offline tools: api/tools.md
- System design:
  - Overview: system_design/README.md
  - Construction: system_design/construction.md
  - Physical state: system_design/physical_state.md
  - PPA accounting: system_design/ppa_accounting.md
  - CIM execution: system_design/cim_execution.md
  - Non-ideality composition: system_design/nonideality_kernels.md
- Conventions:
  - Overview: conventions/README.md
  - Code style: conventions/code_style.md
  - Glossary: conventions/glossary.md
  - Markdown style: conventions/markdown_style.md
  - Module parameter: conventions/module_parameter.md
  - Naming conventions: conventions/naming_conventions.md
  - Notation conventions: conventions/notation_conventions.md
  - Organizing principles: conventions/organizing_principles.md
  - Prose style: conventions/prose_style.md
- Contributing:
  - Overview: contributing/README.md
  - Recipes: contributing/recipes.md
  - Workflow: contributing/workflow.md
  - Writing family docs: contributing/writing_family_docs.md
  - Writing module docs: contributing/writing_module_docs.md
  - Writing system design: contributing/writing_system_design.md
  - Writing tests: contributing/writing_tests.md
- About:
  - Overview: about/README.md
  - Citation: about/citation.md
  - Scope limitations: about/scope_limitations.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

# MathJax (pymdownx.arithmatex generic mode needs the script loaded explicitly).
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
