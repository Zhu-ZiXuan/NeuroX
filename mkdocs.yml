site_name: NeuroX Documentation
site_description: A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models
site_author: Zhu-Zixuan
repo_url: https://github.com/Zhu-Zixuan/NeuroX
repo_name: Zhu-Zixuan/NeuroX
edit_uri: edit/master/docs/

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - toc.integrate
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [neurox]
          options:
            docstring_style: google
            members_order: alphabetical
            show_signature: true
            show_signature_annotations: true
            show_source: false
            show_root_heading: false
            show_category_heading: true

# Navigation mirrors the on-disk ``docs/`` layout.
# - ``dev/``: long-lived internal documentation (architecture rules, module-level
#   design notes, ADRs).  The module index under ``dev/modules/`` is the
#   developer's primary entry point.
# - ``user/``: end-user guides (currently only ``examples.md``; the rest of the
#   user docs are still TODO).
nav:
  - Development:
      - Overview: dev/README.md
      - Roadmap: dev/roadmap.md
      - Architecture:
          - Overview: dev/architecture/README.md
          - Code Style: dev/architecture/code_style.md
          - Config and Construction: dev/architecture/config_and_construction.md
          - Fabrication Lifecycle: dev/architecture/fabrication_lifecycle.md
          - State Holding: dev/architecture/state_holding.md
          - Mapping: dev/architecture/mapping.md
      - Modules:
          - Overview: dev/modules/README.md
          - common:
              - Overview: dev/modules/common/README.md
              - config: dev/modules/common/config.md
              - registry_dispatch: dev/modules/common/registry_dispatch.md
              - load_dump: dev/modules/common/load_dump.md
              - nonideality: dev/modules/common/nonideality.md
              - physical_constant: dev/modules/common/physical_constant.md
              - quant: dev/modules/common/quant.md
          - device:
              - Overview: dev/modules/device/README.md
              - nmos: dev/modules/device/nmos.md
              - rram: dev/modules/device/rram.md
              - wire: dev/modules/device/wire.md
              - selector: dev/modules/device/selector.md
          - analog:
              - Overview: dev/modules/analog/README.md
              - clamp_driver: dev/modules/analog/clamp_driver.md
              - analog_mux: dev/modules/analog/analog_mux.md
              - decoder: dev/modules/analog/decoder.md
              - driver: dev/modules/analog/driver.md
              - switch_cap: dev/modules/analog/switch_cap.md
              - dac:
                  - Overview: dev/modules/analog/dac/README.md
                  - base: dev/modules/analog/dac/base.md
                  - general: dev/modules/analog/dac/general.md
              - adc:
                  - Overview: dev/modules/analog/adc/README.md
                  - base: dev/modules/analog/adc/base.md
                  - general: dev/modules/analog/adc/general.md
                  - mcs_sar: dev/modules/analog/adc/mcs_sar.md
                  - sar_mono: dev/modules/analog/adc/sar_mono.md
              - tia:
                  - Overview: dev/modules/analog/tia/README.md
                  - base: dev/modules/analog/tia/base.md
                  - opamp_tia: dev/modules/analog/tia/opamp_tia.md
          - digital:
              - Overview: dev/modules/digital/README.md
          - xbar:
              - Overview: dev/modules/xbar/README.md
              - base: dev/modules/xbar/base.md
              - ideal: dev/modules/xbar/ideal.md
              - solver: dev/modules/xbar/solver.md
              - 1T1R:
                  - Overview: dev/modules/xbar/_1t1r/README.md
