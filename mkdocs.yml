markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true

extra_css:
  - stylesheets/extra.css

# MathJax (pymdownx.arithmatex generic mode needs the script loaded explicitly).
extra_javascript:
  - javascripts/mathjax.js
