# LeNet macro configuration: lossless integer-matmul baseline.
# IdealCimUnit is the degenerate member of the CimUnit family — no
# xbar tile, no slicing, no transcoding. Useful as a numerical ground
# truth when isolating QAT issues from analog / IO modelling.
# BRING-UP / REFERENCE ONLY — value-domain upper bound, no ADC / no PPA; never
# a production accuracy or hardware result.

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[cim_unit]
_neurox_type = "IdealCimUnitConfig"

# Matches the (x[0,15], w[-1,1]) grid the physical/ideal xbar macros land on
# under the 3-state ternary setting (Sa=4, Sw=1, w_digit_count=1, true_form).
x_value_range = [0, 15]
w_value_range = [-1, 1]
