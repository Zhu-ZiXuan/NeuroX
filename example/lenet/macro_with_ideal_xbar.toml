# LeNet macro configuration with a lossless ideal xbar tile (no noise / no IR-drop).
# Mirrors macro_with_physical_xbar.toml structurally; the only change is the
# inner xbar config — IdealCimMacroConfig in place of Offset1t1rCimMacroConfig.
# Its structural fields (x_value_range, w_value_range) match the physical 1T1R
# value domains, so the two configs expose the same integer matmul contract.
#
# BRING-UP / REFERENCE ONLY — NOT FOR PRODUCTION. This directly instantiates an
# ideal xbar; its params are hand-authored, tied to no fabricated chip, and
# uncalibrated, so its accuracy / PPA are a synthetic reference, not a hardware
# result. The faithful provenance is the ``--cim_macro ideal`` path on
# macro_with_physical_xbar.toml (derives the twin via ``to_ideal()``).

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[cim_unit]
_neurox_class = "LinearCimUnitConfig"

# --- Unit-local peripheral PPA (TODO(data-gap): excludes children, which self-report) ---
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0

[cim_unit.engine]

[cim_unit.engine.weight_slice]
_neurox_class = "InterWeightSliceStageConfig"
w_slice_num = 1
w_encoding = "true_form"

[cim_unit.engine.x_slice]
_neurox_class = "SerialXSliceStageConfig"
x_slice_num = 4

[cim_unit.engine.cim_macro_config]
_neurox_class = "IdealCimMacroConfig"
quantization_scheme = "zero_point"

# --- Activation limit ---
input_num = 64
max_active_num = 64
lane_num = 1
scan_num = 64

# --- PPA ---
leakage_per_inst__uW = 5.0
area_per_inst__um2 = 500.0

# --- IdealCimMacro value domains ---
w_digit_num = 1
w_digit_radix = 2
w_encoding = "true_form"
x_digit_num = 1
x_digit_radix = 2
x_encoding = "unsigned"
x_value_range = [0, 1]
w_value_range = [-1, 1]

# --- Quantization metadata ---
# Synthetic 8-bit ADC reference path (user-authorized sanity check) — wide
# enough that per-cycle quantization noise is negligible. Goal:
# confirm the pipeline (pure QAT + macro inference with rescale fold) is
# mathematically correct end-to-end; gap vs QAT val_acc should be near zero.
# One full-resolution code represents one MAC unit.
adc_bits = 8
rescale_factors = [1.0]


[cim_unit.engine.input_activation.phase_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.placement.contraction_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.x_slice.shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[cim_unit.engine.weight_slice.shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0
