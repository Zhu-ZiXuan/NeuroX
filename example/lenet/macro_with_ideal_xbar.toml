# LeNet macro configuration with a lossless ideal xbar tile (no noise / no IR-drop).
# Mirrors macro_with_physical_xbar.toml structurally; the only change is the
# inner xbar config — IdealCimMacroConfig in place of Offset1t1rCimMacroConfig.
# The IdealCimMacroConfig structural fields (x_range, w_digit_count/radix/range)
# match the physical 1T1R defaults so this TOML is numerically equivalent to
# running macro_with_physical_xbar.toml with ``--cim_macro ideal``.
#
# BRING-UP / REFERENCE ONLY — NOT FOR PRODUCTION. This directly instantiates an
# ideal xbar; its params are hand-authored, tied to no fabricated chip, and
# uncalibrated, so its accuracy / PPA are a synthetic reference, not a hardware
# result. The faithful provenance is the ``--cim_macro ideal`` path on
# macro_with_physical_xbar.toml (derives the twin via ``to_ideal()``).

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[cim_unit]
_neurox_class = "LinearCimUnitConfig"

# --- Unit-local peripheral PPA (TODO(data-gap): excludes children, which self-report) ---
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0

[cim_unit.engine]
_neurox_class = "InterArraySliceCimEngineConfig"

# --- Slice counts ---
w_slice_num = 1
x_slice_num = 4

# --- Slice encodings ---
w_encoding = "true_form"

[cim_unit.engine.cim_macro_config]
_neurox_class = "IdealCimMacroConfig"

# --- Tile size ---
col_num = 64
row_num = 64
active_row_num = 64  # rows activated per active phase (= row_num: single-phase)

# --- PPA ---
leakage_per_inst__uW = 5.0
area_per_inst__um2 = 500.0

# --- IdealCimMacro structural fields ---
x_range = [0, 1]
w_digit_count = 1
w_digit_radix = 2
w_digit_range = [-1, 1]

# --- ADC operating-point metadata ---
# Synthetic 8-bit ADC reference path (user-authorized sanity check) — wide
# enough that per-cycle quantization noise is negligible. Max per-cycle
# dot magnitude for LeNet ≤ 64 (full tile) → max code ≤ 128 within 8-bit
# signed [-128, 127]. Goal: confirm the refactored pipeline (pure QAT +
# macro inference with rescale fold) is mathematically correct end-to-end;
# gap vs QAT val_acc should be near zero. IdealCimMacro derives the rescale
# from adc_bits and integer geometry alone — no calibration table needed.
adc_mode_num = 1
adc_max_bits = 8


[cim_unit.engine.phase_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.col_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.sa_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[cim_unit.engine.sw_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0
