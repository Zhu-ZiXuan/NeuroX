# Nonideality policy for the LeNet ideal-xbar macro.
#
# The ideal xbar carries no physical nonidealities, so its policy is the
# empty IdealCimMacroPolicy wrapped in the macro policy.

[policy]
_neurox_class = "LinearCimUnitPolicy"

[policy.engine]
[policy.engine.cim_macro_policy]
_neurox_class = "IdealCimMacroPolicy"

[policy.engine.placement]

[policy.engine.input_activation]

[policy.engine.weight_slice]
_neurox_class = "InterWeightSliceStagePolicy"

[policy.engine.x_slice]
_neurox_class = "SerialXSliceStagePolicy"
