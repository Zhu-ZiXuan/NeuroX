# Forward TIA design config — 1T1R 28nm chip, 3-state ternary LeNet workload.
#
# [hardware] are externally fixed parameters; the four [sweep] axes are the
# TIA design knobs the optimiser explores.

[hardware]
v_dd__V = 0.9
v_ref__V = 0.1
output_saturation_softness__V = 0.45
target_v_max__V = 0.8  # ADC max v_ref mode; v_out should fill [0, 0.8] not [0, 0.9]

[hardware.nmos_config]
_neurox_use_preset = "process/mos:nmos_28_rvt"

# Per-column BL current model derived manually from the chip preset
# (row_num=64, state_to_g_map = [10, 54.26, 100] uS → solver-realised
# per-cell currents at V_BL=0.1V: [0.9967, 5.3206, 9.6446] uA;
# see log/rram_states_vbl0p1/calc.log).
#
# Active-cell distribution (x_bit=1): uniform on the three currents.
#   E[I_active]  = 5.3206 uA
#   E[I_active^2] = 40.7736
#   Var[I_active] = 12.4648
# Per-cell contribution (x_bit ~ Bern(0.5)):
#   E[X]  = 2.6603 uA
#   E[X^2] = 20.3868
#   Var[X] = 13.3096
# 64-row sum (independent rows):
#   mean = 64 * 2.6603    = 170.26 uA
#   var  = 64 * 13.3096   = 851.81
#   std  = sqrt(var)      = 29.19 uA
[workload]
mean__uA = 170.26
std__uA  = 29.19

# Stage-2 refined sweep around Stage-1 top region (gain 40-50, W 0.2-0.5, Vb 0.7-0.8).
[sweep]
opamp_gain        = [35, 40, 45, 50]
pseudo_nmos_W__um = [0.20, 0.225, 0.25, 0.275, 0.30, 0.325, 0.35, 0.375, 0.40, 0.425, 0.45, 0.475, 0.50]
pseudo_nmos_L__um = [0.03]
v_nmos_bias__V    = [0.65, 0.675, 0.70, 0.725, 0.75, 0.775, 0.80, 0.825, 0.85]
