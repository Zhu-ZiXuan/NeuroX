# Differential-ADC boundary calibration: emit a ready-to-paste
# ``[bl_adc]`` TOML block whose code boundaries cover the chip's
# achievable BL-difference current range.
#
# CLI: python -m neurox.tools.xbar_adc_boundaries \
#          --config example/config/xbar_adc_boundaries.toml \
#          --output /tmp/bl_adc.toml \
#          --visualize

[xbar]
_neurox_use = "1t1r_28nm.toml:xbar"


# ``n_random`` controls how many random input groups are tested when
# building the boundary distribution. ``n_random <= 0`` switches to a
# deterministic corner-case sweep instead.
[sampling]
n_random = 256
use_noise = false


# Weight transcoder encoding for the calibration sweep. Valid values are
# "canonical", "complement", "true_form" (per Transcoder registry).
[transcoder]
encoding = "complement"
