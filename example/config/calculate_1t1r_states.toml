# Solve the per-state RRAM conductance ladder so the 1T1R cell current is
# linearly spaced across state indices under a fixed read bias.
#
# CLI: python -m neurox.tools.calculate_1t1r_states \
#          --config example/config/calculate_1t1r_states.toml

# Device process configs — typically pulled from the bundled process presets.
[rram]
_neurox_use_preset = "process/rram:default"

[nmos]
_neurox_use_preset = "process/mos:nmos_28_rvt"


# Per-cell read bias used during state-map derivation. Note these are the
# voltages at which the conductance ladder is *linearised* — they may match
# the chip's runtime BL/SL drive but are conceptually independent inputs.
[bias]
v_wl__V = 1.2
v_bl__V = 0.1
v_sl__V = 0.0
temperature__K = 300.0


# RRAM design window + state count + access-NMOS sizing.
[design]
g_max__uS = 100.0
n_states = 3
access_nmos_W__um = 0.150
access_nmos_L__um = 0.028
