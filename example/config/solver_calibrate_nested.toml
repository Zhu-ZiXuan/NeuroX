# Calibrate NestedSolver (n_outer, n_inner) via step-ratio plateau.
#
# CLI: python -m neurox.tools.solver_calibrate.nested \
#          --config example/config/solver_calibrate_nested.toml \
#          --plot-dir log/solver_calibrate/nested/ \
#          --device cuda:0

[xbar]
_neurox_use = "1t1r_28nm.toml:xbar"


# Per-VMM workload + sweep dimensions:
#   inst_shape           parallel xbar instances (outer batch axis)
#   weight_samples       total distinct weight programmings (must be a
#                        multiple of batch_w)
#   input_samples_per_weight  per-programming input vector count
#   batch_w              weight-axis chunk size during streaming
[workload]
inst_shape = [256]
weight_samples = 256
input_samples_per_weight = 8
batch_w = 256
# distribution = "synthetic.toml"   # optional, relative to this TOML


# 2-axis sweep: Stage A picks n_outer at n_inner = inner_ref; Stage B
# picks n_inner at the Stage-A n_outer pick. Margins add to the final
# picked counts for safety.
[sweep]
outer_candidates = [1, 2, 3, 4, 5, 6, 7, 8]
inner_candidates = [1, 2, 3, 4, 5]
inner_ref = 5
ratio_threshold = 0.5
reltol = 1e-2
outer_margin = 1
inner_margin = 0


[runtime]
dtype = "float32"
seed = 0
