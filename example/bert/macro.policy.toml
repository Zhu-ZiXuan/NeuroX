# Nonideality policy for the BERT physical-xbar macro.
#
# References the offset scheme's all-off policy (works/offset_1t1r/); every switch is off by default.
# To enable a nonideality, override a switch exposed by the selected
# concrete macro policy.
# Chunking knob lives under [policy.cim_macro.array] (solve_chunk_size).

[policy]
_neurox_use = "../../works/offset_1t1r/presets/policy/all_off.toml:cim_unit"

[policy.cim_macro.array]
# Max instances solved per chunk = per-chunk peak-memory budget. Sized for the
# COMPILED solve, whose PCR intermediates are co-resident (no per-step release),
# so the budget is smaller than an eager run would need. One value gives a
# uniform chunk shape across layers -> one dynamic=False solve compile
# signature. See docs/internals/compile/scheme-a-regional.md.
solve_chunk_size = 16384
