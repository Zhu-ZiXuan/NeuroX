# BERT-small standalone ideal-twin macro config (synthetic 8-bit ADC).
# Mirrors example/bert/macro.toml structurally; the only change is the
# inner xbar — a directly-instantiated IdealCimMacroConfig (adc_max_bits = 8)
# in place of the physical 1T1R tile.
#
# BRING-UP / REFERENCE ONLY — NOT FOR PRODUCTION. Direct instantiation of an
# ideal xbar is a convenience for getting the flow working and for a lossless
# sanity reference; its parameters are hand-authored, tied to no fabricated
# chip, and uncalibrated, so its accuracy / PPA are a synthetic reference, not
# a hardware result. The faithful ideal twin is `evaluate.py --cim_macro ideal` on
# the physical config (macro.toml), which derives the twin from the real chip
# via `to_ideal()`.

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[cim_unit]
_neurox_class = "LinearCimUnitConfig"

# --- Unit-local peripheral PPA (TODO(data-gap): excludes children, which self-report) ---
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0

[cim_unit.engine]
input_num = 64
output_num = 64

[cim_unit.engine.weight_slice]
_neurox_class = "InterWeightSliceStageConfig"
w_slice_num = 1
w_encoding = "true_form"

[cim_unit.engine.x_slice]
_neurox_class = "SerialXSliceStageConfig"
x_slice_num = 4

[cim_unit.engine.cim_macro_config]
_neurox_class = "IdealCimMacroConfig"

max_active_num = 64

leakage_per_inst__uW = 5.0
area_per_inst__um2 = 500.0

x_value_range = [0, 1]
w_value_range = [-1, 1]

# 8-bit synthetic ADC reference (see comment in lenet/macro_with_ideal_xbar.toml).
# IdealCimMacro derives the rescale from adc_bits + integer geometry; no
# calibration table needed here.
adc_mode_num = 1
adc_max_bits = 8


[cim_unit.engine.placement.phase_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.placement.contraction_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[cim_unit.engine.x_slice.shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[cim_unit.engine.weight_slice.shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0
