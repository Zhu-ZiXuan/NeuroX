# BERT-small ideal-twin macro configuration (synthetic 6-bit ADC).
# Mirrors example/bert/macro.toml structurally; differs only in the inner
# xbar: standalone IdealXbarConfig with one synthetic 6-bit ADC mode
# instead of the physical 4-bit chip. Used by evaluate.py as the
# 'reference' path that matches the QAT-trained quantization grid
# faithfully (4-bit physical chip's per-cycle LSB can't resolve the
# per-cycle dot magnitude after Sa=4 bit-slicing — see
# example/lenet/macro_with_ideal_xbar.toml comment).

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[macro]
_neurox_type = "InterArraySliceXbarMacroConfig"

w_slice_num = 1
x_slice_num = 4
w_encoding = "true_form"

[macro.xbar_config]
_neurox_type = "IdealXbarConfig"

col_num = 64
row_num = 64

latency_per_op__ns = 5.0
leakage_per_inst__uW = 5.0
area_per_inst__um2 = 500.0

x_range = [0, 1]
w_digit_count = 1
w_digit_radix = 2
w_digit_range = [-1, 1]

# 8-bit synthetic ADC reference (see comment in lenet/macro_with_ideal_xbar.toml).
adc_mode_num = 1
adc_max_bits = 8

[[macro.xbar_config.adc_calibration]]
adc_mode = 0
adc_bits = 8
rescale_factor = 0.5


[macro.col_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[macro.sa_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[macro.sw_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0
