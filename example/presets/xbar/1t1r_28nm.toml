# Reference 1T1R xbar configuration (28nm). Bundled preset under neurox/presets/xbar/.

[xbar]
_neurox_type = "Offset1T1RXbarConfig"

# --- Tile size ---
col_num = 64
row_num = 64

# --- PPA ---
area_per_inst__um2 = 500.0
leakage_per_inst__uW = 5.0
latency_per_op__ns = 5.0

# --- Weight encoding ---
w_digit_count = 1
w_digit_radix = 2
w_state_offset = 1

# --- Reference-column scheme ---
ref_group_size = 16
ref_location = 8

# --- ADC ``adc_operation_point → rescale_factor`` lookup table ---
# Calibrated 2026-06-08 with LS+intercept at 8-bit ADC. b_offset informational
# only (not yet plumbed through macro). r_max scales monotonically with v_ref
# as expected for the now-finer SAR LSB.
[[xbar.adc_calibration]]
adc_mode = 0
adc_bits = 8
rescale_factor = 2.8977
b_offset = 1.3585

[[xbar.adc_calibration]]
adc_mode = 1
adc_bits = 8
rescale_factor = 1.4879
b_offset = 0.6961

[[xbar.adc_calibration]]
adc_mode = 2
adc_bits = 8
rescale_factor = 0.7482
b_offset = 0.3430

[[xbar.adc_calibration]]
adc_mode = 3
adc_bits = 8
rescale_factor = 0.3745
b_offset = 0.1591

[[xbar.adc_calibration]]
adc_mode = 4
adc_bits = 8
rescale_factor = 0.1874
b_offset = 0.0657


[xbar.core_config]

# --- Pulse timing ---
wl_pulse_length__ns = 3.0

# --- Layout pitch ---
row_first_space__um = 1.000
row_cell_space__um = 0.040
col_first_space__um = 1.000
col_cell_space__um = 0.040

# --- BL wire segments ---
bl_first_r__MOhm = 5e-6
bl_first_c__fF = 0.200
bl_segment_r__MOhm = 2e-7
bl_segment_c__fF = 0.008

# --- SL wire segments ---
sl_first_r__MOhm = 5e-6
sl_first_c__fF = 0.200
sl_segment_r__MOhm = 2e-7
sl_segment_c__fF = 0.008

# --- WL wire segments ---
wl_first_r__MOhm = 5e-6
wl_first_c__fF = 0.200
wl_segment_r__MOhm = 2e-7
wl_segment_c__fF = 0.008

# --- Access-NMOS sizing ---
access_nmos_W__um = 0.150
access_nmos_L__um = 0.028

# --- Access-NMOS parasitic-cap densities ---
c_gs_per_um__fF = 0.6396
c_gd_per_um__fF = 0.6396
c_db_per_um__fF = 0.85

# --- RRAM design window + state map ---
rram_g_max__uS = 100.0
state_to_g_map__uS = [10.0, 54.2591294879, 100.0]


[xbar.core_config.rram_config]
_neurox_use_preset = "process/rram:default"


[xbar.core_config.nmos_config]
_neurox_use_preset = "process/mos:nmos_28_rvt"


[xbar.core_config.tia_config]
_neurox_type = "OpAmpTIAConfig"

# --- Reference / supply ---
v_ref__V = 0.1
v_nmos_bias__V = 0.9
v_dd__V = 0.9

# --- Op-amp gain ---
opamp_gain = 30.0

# --- Op-amp gain mismatch ---
opamp_gain_sigma = 0.0

# --- Pseudo-resistor NMOS ---
pseudo_nmos_W__um = 0.250
pseudo_nmos_L__um = 0.030

# --- Output rail limiter ---
output_saturation_softness__V = 0.45

# --- Newton solver iteration count (calibrated via solver_calibrate.tia) ---
# Picked by step-ratio plateau on V_clamp (ratio_threshold=0.5) + relative
# residual guard (reltol=1e-2 vs max|I_port|). Margin +1 added.
# Calibrated at fp32 (production dtype); fp32 hits its accumulated round-off
# floor by iter 4, so we use 5 with the safety margin. fp64 needs n=6; the
# fp32 value is sufficient for fp64 too (extra Newton steps in fp64 cost
# almost nothing once at the floor).
n_newton = 5

# --- PPA ---
leakage_per_inst__uW = 1.0
area_per_inst__um2 = 10.0
latency_per_op__ns = 2.0

[xbar.core_config.tia_config.nmos_config]
_neurox_use_preset = "process/mos:nmos_28_rvt"


[xbar.core_config.sl_driver_config]

# --- Drive ---
drive_value = 0.0

# --- Drive thermal noise ---
drive_thermal__V = 0.0

# --- PPA ---
latency_per_op__ns = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0


[xbar.core_config.solver_config]
_neurox_type = "NestedSolver1T1RConfig"

# --- Iteration counts (calibrated via solver_calibrate.nested) ---
# Picked by step-ratio plateau on the full unknown vector
# (V_BL, V_SL, V_X, V_BL_clamp, V_SL_drive) — convergence is judged
# from the iterate sequence itself reaching its round-off floor, not
# from an absolute residual target. Workload-derived relative residual
# guard (reltol=1e-2) is a sanity net only.
# Outer Newton is coupled 2×2 over (V_BL_clamp, V_SL_drive) — the
# implicit-function Jacobian carries BL ↔ SL cross terms so that a
# variable-SL driver is supported natively.
# Calibrated at fp32 (production dtype): step plateau lands at
# n_outer=3, n_inner=1; picker recommends with margin (+1, +0). For
# fp64 simulation the same counts work — fp64 reaches its own deeper
# floor in similar iter count under this coupled outer scheme.
n_outer = 4
n_inner = 1

# Reference / experimental alternative: FullJacobianSolver1T1RConfig
# with n_newton = 4 (fp32) / 5 (fp64) lifts every unknown (including
# V_X) into one global Newton step. Kept as an independent reference
# implementation for cross-checking nested, NOT recommended as a
# production swap-in: it uses ~2× peak GPU memory than nested
# (block-3×3 Thomas + V_X-in-vector) and OOMs on large batches at
# fp64. Use it for solver-correctness debug, FD Jacobian verification
# (tests/test_full_jacobian_fd_verify.py), or to validate nested's
# answer on small workloads. To switch:
#     [xbar.core_config.solver_config]
#     _neurox_type = "FullJacobianSolver1T1RConfig"
#     n_newton = 4


[xbar.core_config.wl_dac_config]
_neurox_type = "GeneralDACConfig"

# --- LUT ---
code_to_signal = [0.0, 1.2]

# --- Drive thermal noise ---
drive_thermal__V = 0.0

# --- Energy / PPA ---
energy_per_op__fJ = 0.0
latency_per_op__ns = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0


[xbar.readout_config]
_neurox_type = "OffsetSwitchCapMuxAdcReadOutConfig"

# --- Energy / PPA ---
energy_per_op__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_config.data_switchcap_config]

# --- Unit capacitance ---
c_unit__fF = 5.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 0.005

# --- Energy / PPA ---
energy_per_sample_overhead__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_config.ref_switchcap_config]

# --- Unit capacitance ---
c_unit__fF = 5.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 0.005

# --- Energy / PPA ---
energy_per_sample_overhead__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_config.analog_mux_config]

# --- Gain ---
mux_gain = 1.0

# --- Common-mode noise ---
mux_noise_cm_sigma__V = 1e-3

# --- Differential-mode noise ---
mux_noise_dm_sigma__V = 1e-3

# --- Energy / PPA ---
energy_per_access__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_config.adc_config]
_neurox_type = "McsSarAdcConfig"

# --- Topology ---
# 8-bit SAR (was 4-bit). Same analog stack (v_refs / switch-cap / TIA);
# more SAR cycles → smaller per-mode r_max (scales ~1/16 vs 4-bit at
# same v_ref). Re-calibrated 2026-06-08; see [[xbar.adc_calibration]].
max_bits = 8

# --- References + timing ---
v_refs__V = [0.8, 0.4, 0.2, 0.1, 0.05]
clk_period__ns = 2.0

# --- CDAC unit ---
c_unit__fF = 2.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 5e-3

# --- Comparator static offset ---
comparator_offset_sigma__V = 3e-3

# --- Comparator thermal noise (per-cycle) ---
comparator_thermal_noise_sigma__V = 5e-4

# --- Energy ---
e_bootstrap__fJ = 20.0
e_constant_per_bit__fJ = 12.0

# --- PPA ---
leakage_per_inst__uW = 0.5
area_per_inst__um2 = 250
