[build-system]
requires = ["setuptools>=77.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurox"
version = "0.1.0"
description = "A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "torch>=2.11",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
calib = [
    "matplotlib>=3.8.4",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
    "types-PyYAML",
]

[tool.setuptools.packages.find]
include = ["neurox", "neurox.*"]

[tool.setuptools.package-data]
"neurox.presets" = ["**/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
strict_config = true
strict_markers = true

[tool.mypy]
python_version = "3.12"
strict = true
allow_untyped_decorators = true
allow_untyped_calls = true
warn_unused_configs = true
warn_unreachable = true
