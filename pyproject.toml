[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurox"
version = "0.1.0"
description = "A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "ZHU-ZiXuan" }]
dependencies = [
    "torch>=2.10",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
demo = [
    "torchvision>=0.20.0",
    "torchao>=0.10.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
]

[dependency-groups]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-PyYAML",
]
docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.urls]
"Homepage" = "https://github.com/Zhu-ZiXuan/NeuroX"
"Bug Tracker" = "https://github.com/Zhu-ZiXuan/NeuroX/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurox*"]

[tool.setuptools.package-data]
"neurox.presets" = ["**/*.toml"]
"neurox.works" = ["**/*.toml"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.13"

strict = true
allow_untyped_decorators = true
allow_untyped_calls = true

namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true
no_implicit_optional = true
