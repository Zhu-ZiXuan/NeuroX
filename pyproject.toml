[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "neurox"
version = "0.1.0"
description = "A PyTorch-based neuromorphic computing simulation framework, for algorithmic accuracy with circuit-level PPA, from device physics to AI models"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "ZHU-ZiXuan" }]
dependencies = [
    "torch>=2.9",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "tomli-w>=1.0",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "mypy",
    "pytest",
    "pytest-cov",
    "pre-commit",
    "types-PyYAML",
]
doc = [
    "mkdocs",
    "mkdocs-material",
    "mkdocstrings[python]",
]
demo = [
    "torchvision>=0.20.0",
    "torchao>=0.10.0",
    "transformers>=4.40.0",
    "datasets>=2.18.0",
]

[project.urls]
"Homepage" = "https://github.com/Zhu-ZiXuan/NeuroX"
"Bug Tracker" = "https://github.com/Zhu-ZiXuan/NeuroX/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["neurox*"]

[tool.setuptools.package-data]
"neurox.presets" = ["**/*.toml"]
"neurox.works" = ["**/*.toml"]

[tool.ruff]
target-version = "py311"
line-length = 120
indent-width = 4

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
select = [
    "F",    # pyflakes
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "I",    # isort
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "N",    # pep8-naming
    "C4",   # flake8-comprehensions
    "PERF", # perflint
    "A",    # flake8-builtins
    "T10",  # flake8-debugger
    "T20",  # flake8-type-checking
    "ANN",  # flake8-annotations
    "G",    # flake8-logging-format
    "ICN",  # import conventions
    "TID",  # flake8-tidy-imports
]
ignore = [
    "E501", # line too long
    "N812", # lowercase imported as non-lowercase
    "RUF022", # `__all__` is not sorted
    "F841", # local variable is assigned to but never used

    "A002", # function argument is shadowing a Python builtin
    "N802", # function name should be lowercase
    "N803", # argument name should be lowercase
    "N806", # variable in function should be lowercase
    "N815", # mixedCase variable in class scope
]

fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ANN", # flake8-annotations
    "D",   # pydocstyle
    "T201", # `print` found
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.mypy]
python_version = "3.11"

strict = true
allow_untyped_decorators = true
allow_untyped_calls = true

namespace_packages = true
explicit_package_bases = true
ignore_missing_imports = true
warn_unused_configs = true
warn_no_return = true
warn_unreachable = true
no_implicit_optional = true
