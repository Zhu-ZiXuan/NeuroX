# Test fixture: 1T1R macro configuration. Pulls xbar from neurox/presets/xbar/.

[digit_adder]
bit_width = 32
area_per_inst__um2 = 40.0
leakage_per_inst__uW = 0.8
latency_per_op__ns = 0.25
energy_per_op__fJ = 30.0

[accumulator]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[shift_adder]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[w_transcoder]
encoding = "true_form"

[x_transcoder]
encoding = "true_form"
digit_num = 4


[macro]
_neurox_type = "InterArraySliceXbarMacroConfig"

# --- Slice counts ---
w_slice_num = 1
x_slice_num = 4

# --- Slice encodings ---
w_encoding = "true_form"

[macro.xbar_config]
_neurox_use_preset = "xbar/1t1r_28nm:xbar"

[macro.col_accumulator_config]
bit_width = 32
area_per_inst__um2 = 60.0
leakage_per_inst__uW = 1.0
latency_per_op__ns = 0.5
energy_per_op__fJ = 50.0

[macro.sa_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0

[macro.sw_shift_adder_config]
bit_width = 32
area_per_inst__um2 = 75.0
leakage_per_inst__uW = 1.5
latency_per_op__ns = 0.5
energy_per_op__fJ = 80.0
