# Tall near-single-output geometry override for the smoke / mismatch tests.
#
# Merged (first-wins, deep) ON TOP of params/default.toml so the tests reuse
# every physical / PPA / solver value the canonical config ships, but reshape
# the tile to a tall two-output size: col_num = 2 logical -> 4 physical
# columns (one P/N polarity pair per logical column), row_num = 16 with
# active_row_num = 8 -> row_num / active_row_num = 2 WL sub-phases per VMM,
# so a single +/-1-programmed column realizes every per-plane integer
# M = 0..8, past the 3-bit magnitude saturation at 7, and full-drive MACs
# reach 16 via the two-plane sum. Strict divisibility holds: mux_factor = 1 divides
# col_num (n_lane = 2 front-end lanes per polarity, sizing the BL clamp and
# p-mirror) and io_col_num = 2 divides col_num (n_io = 1).
#
# ref_levels__uA / i_refs__uA are probed AT THIS geometry (the analog
# I_SUB(M) grid is geometry- and loading-dependent) by the same
# loading-band mid-point method as the canonical thresholds — ref[j] =
# 0.5 * (hi(j) + lo(j+1)), hi = lightest-loading edge (only the M LSB
# cells' rows driven, first active phase), lo = heaviest-loading edge (all
# 8 rows of the last active phase driven), all_off policy; see the
# derivation note on adc_config.ref_levels__uA in params/default.toml.
# I_SUB(M) grid [uA], M = 0..8, lightest edge: 0.000000, 1.674891,
# 3.343821, 4.994869, 6.639957, 8.267164, 9.900331, 11.509657, 13.113022;
# heaviest edge: 0.000000, 1.668930, 3.331900, 4.982948, 6.628036,
# 8.261204, 9.888411, 11.503696, 13.113022. At this tiny geometry the full
# band is separable (no top-threshold exception). The two threshold copies
# below must stay equal (validate_ref_consistency).

[cim_macro]
_neurox_class = "IsubIadc1t1rCimMacroConfig"
col_num = 2
row_num = 16
active_row_num = 8
mux_factor = 1
io_col_num = 2

# The tiny fixture is a 3-bit single-mode tile (the canonical config is a
# 5-bit multi-mode bank): the overlay pins the quantizer width, the 3-step
# sensing latency, and the single-mode calibration record wholesale
# (first-wins replaces the whole [[adc_calibration]] list).
[[cim_macro.adc_calibration]]
adc_mode = 0
adc_bits = 3
rescale_factor = 1.0

[cim_macro.adc_config]
n_bits = 3
step_latency__ns = [3.16, 3.07, 3.11]
ref_levels__uA = [[0.834465, 2.503395, 4.163384, 5.811453, 7.450581, 9.077787, 10.702014]]

[cim_macro.reference_config]
i_refs__uA = [[0.834465, 2.503395, 4.163384, 5.811453, 7.450581, 9.077787, 10.702014]]
