# Paper-design params for the Ye et al. (JSSC 2023) WH-2T1R RRAM CIM macro — the
# campaign's design point, every physical value provenance-tagged (legend in
# docs/validation/campaigns.md). Spec: docs/works/macro/cim/ye2023jssc/model.md;
# measured outcomes: results.md.
#
# The SANCTIONED free-parameter set is exactly four numbers: the RS-CSA
# `mirror_scale` and `e_fixed_per_op__fJ`, and the two transcribed seat powers.
# Every other value carries a non-[calibrated] tag and is pinned by it.
#
# PENDING RECAL. Two families of value below are unsolved, so the validate gate
# runs RED until the recalibration campaign closes them:
#   * the array's four per-node capacitances, one per cell node (the cell's own
#     junction plus that node's share of the line it hangs on), of which the WL
#     node total carries the C_WL knob;
#   * the two converter energy tuples, which bill the WL and BL drive events.
# The C_WL band and its saturation status are solved against the array pin and
# must be re-established over these values.
#
# Pull this fragment from a user config with:
#   [cim_macro]
#   _neurox_use = "params.toml:cim_macro"   # (path relative to your file)

[cim_macro]
_neurox_class = "Ye2023JsscCimMacroConfig"

# --- Activation limit (owner supplies input_num=32 and output_num=64) ---
max_active_num = 32               # [derived] input-parallel: every input selected at once

# --- Biases ---
v_tbl__V = 0.1                    # [measured p4 Fig.7(a)] TBL clamp; operating-point datum, not consumed by the energy path
v_sl__V = 0.0                     # [measured p4 Fig.7(a)] source-line drive (grounded)

# --- Readout PH0 compensation ---
# [derived] continuity seat equal to the retired in-code derivation (floor x 352
# radix units); the recalibration campaign will re-anchor it to the measured
# 1.0 uA row leakage.
i_ph0_comp__uA = 1.000032

# --- Supply rails (three variables, kept separate even when numerically equal) ---
# `v_dd_core__V` is the READOUT rail: the DL conduction branch bills across it and
# it is cross-checked against `adc_config.v_rail__V`. The other two are DRIVER
# rails: the array draws every node's charge from the supply of the driver that
# moves it, and the macro's BL input-branch conduction is drawn from the BL one.
# [assumed] both: the paper reports no separate BL-driver or WL-driver supply. The
# BL input driver is taken to hang off the core supply (0.8 V is the only reported
# on-chip rail), and the WL driver is a 1-bit rail-to-rail driver, so its rail is
# taken as its own ON level (the `wl_dac_config` code_to_signal top entry, 0.6 V)
# -- restated here because a rail may never be read out of another block's
# transfer table.
v_dd_core__V = 0.8                # [measured p6 Table II] core supply rail; the DL conduction is billed across it
v_dd_bl__V = 0.8                  # [assumed] BL driver rail = the core supply (BL input branch + BL/X/SL nodes)
v_dd_wl__V = 0.6                  # [assumed] WL driver rail = the assumed WL ON level (the WL nodes)

# --- Flat peripheral per-op energies ---
# [derived] Structural zeros: both seats are billed as PURE STATIC leakage (their
# transcribed block powers are flat across the two Fig.19 points), so no per-op
# dynamic share exists.
e_mux_driver_per_op__fJ = 0.0
e_timing_ctrl_per_op__fJ = 0.0

# --- Macro-owned static PPA lump (every seat carries its own) ---
# [derived] Structural zeros: the macro declares no static PPA of its own.
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- Quantization operating points (single nominal mode) ---
# The RS-CSA is a 4-bit uniform current quantizer; the rescale maps its integer
# code onto the ideal macro's code at the same bit width.
# [derived] I_LSB = 7 uA against 0.5 uA per unit MAC -> a code carries 14 MAC
# units, so the 16-code window spans [0, 223]. The unsigned readout rises with
# the MAC itself, so its input code axis IS that window, and one code carries
# exactly the window step the ideal macro resolves at 4 bits -> no rescale.
[[cim_macro.modes]]
quantization_input_range = [0, 223]
adc_input_code_range = [0, 223]
max_bits_rescale_factor = 1.0


# --- WH-2T1R array (works-local) -- chunk-fused step1 divider solve + step2 I_T2 sum ---
# Physical rows = logical outputs (64, the TBL / ladder direction); physical
# columns = 32 * (3 weight planes + 1 redundant plane) = 128, plane-major. The
# array bills EVERY cap inside it under the held-BL / scanned-WL law (per-access
# displacement off the ideal rest level, plus one hold establishment amortized
# over the row scan); the macro bills the conduction branches.
[cim_macro.array_config]

# --- Weight fan-out geometry ---
weight_radix = [1, 2, 4]          # [measured p4 Fig.7(a)] SUBA1/2/3 T2 slice multipliers, LSB-first
redundant_radix = [4]             # [measured p4 Fig.7(a)] SUBA4 redundant slice, m(T2) = 4
v_bl_in1__V = 0.3                 # [measured p4 Fig.7(a)] BL level for IN = 1 (IN = 0 -> 0 V)

# --- Layout pitch [um] ---
# One pitch per axis: the lattice is uniform and whatever lead-in a boundary
# driver needs to reach its first seat is that driver's business.
# [assumed] 28nm typical.
row_cell_space__um = 0.040
col_cell_space__um = 0.040

# --- BL / SL rail links ---
# Cell-to-cell segment resistance; solver physics, MUST be > 0. The WL is
# gate-only (carries no DC current), so it has no R field.
# [assumed] 28nm typical, both entries.
bl_segment_r__MOhm = 5.0e-6
sl_segment_r__MOhm = 5.0e-6

# --- Per-node capacitance [fF] ---
# One total per cell node: the cell's own junction plus that node's share of the
# line it hangs on. The array bills all four -- the BL and X nodes through the
# level the input is held at (X is pinned to V_BL through the RRAM while T1 is
# off, and dips when the selected row turns on), the SL node through its
# displacement off the grounded rest, the WL node through the per-access gate
# toggle.
# [derived] junction + line share per node, at 28nm-typical junction priors:
# BL 0.250 + 0.055, X 0.150 (the access node hangs on no line), SL 0.010 + 0.008,
# WL 1.504 + 0.055. PENDING RECAL: the WL node total carries the C_WL knob, whose
# band and saturation status are solved against the array pin.
bl_node_c__fF = 0.305
x_node_c__fF = 0.150
sl_node_c__fF = 0.018
wl_node_c__fF = 1.559


# --- WH-2T1R lookup cell = linear 1T1R divider (step1) + I_T2 table (step2) ---
# Divider roots: R_LRS = 10 k, R_HRS = 100 k [measured p3 Fig.4(c)];
# R_T1 = sqrt(R_HRS * R_LRS) = 31.6 k [derived] -- the half-activated T1
# geometric-mean bias point that maximizes dV_X (p4 Fig.5).
[cim_macro.array_config.cell_config]
_neurox_class = "Ye2023Jssc2t1rCellConfig"

# --- Divider tables [uS] / ratios, indexed by weight-state (0 = HRS, 1 = LRS) ---
# [derived] g_cell = 1 / (R_RRAM + R_T1): HRS = 1/131.6k, LRS = 1/41.6k;
# vx_ratio = R_RRAM / (R_RRAM + R_T1): HRS = 0.760, LRS = 0.240.
g_cell_off_table__uS = [0.001, 0.001]     # [assumed] WL off -> negligible conduction
g_cell_on_table__uS = [7.5975, 24.0253]
vx_ratio_off_table = [0.0, 0.0]           # [derived] unselected row, T1 off, V_X pinned to BL
vx_ratio_on_table = [0.760, 0.240]

# --- Analog WL level above which the access device counts as on ---
v_wl_on_threshold__V = 0.3        # [derived] midpoint of WL_sel = 0.6 V and WL_off = 0 V

# --- Step2 T2 compute current [uA], indexed [operating_point][weight_state] ---
# I_T2 = f(V_X) sampled at two calibration operating points: index 0 the FLOOR at
# V_X = 0, index 1 the DRIVE point at V_X > 0.
# [0][*] = off-cell floor I_0 at V_X = 0 (the per-cell contribution to the row
#   leakage). [derived]: 1.0 uA measured row leakage / 352 radix units, where
#   352 = 32 inputs * (1+2+4+4) and the array radix-weights every cell, so an
#   all-zero-input row sums to exactly the PH0 nominal (zero MAC -> code 0).
# [1][HRS] = 0.0075 uA [bound-derived]: the radix multiplier is retained, so the
#   m = 4 plane saturates the measured < 30 nA bound on the RAW per-plane HRS
#   current.
# [1][LRS] = 0.50 uA [measured p7 Fig.16(b)]: the unit-slice on-current I_unit at
#   the drive point.
i_t2_table__uA = [[0.002841, 0.002841], [0.0075, 0.50]]


# --- Array DC solver (ColBlColSlSolver) -- outer V_clamp / inner wire Newton ---
# One active row per output -> a light, near-linear solve; the nested counts are
# still used (BL/SL wire coupling).
[cim_macro.array_config.solver_config]
_neurox_class = "ColBlColSlSolverConfig"
# [assumed] step1 iteration counts; the run config for a formal sweep is under tools/.
n_outer = 4
n_inner = 3


# --- RS-CSA readout (RsCsaIadc) -- 4-bit uniform current quantizer + static PH0 ---
# The PH0 compensation current the readout subtracts is the macro-level
# `i_ph0_comp__uA` seat above; the readout itself declares no field for it.
[cim_macro.adc_config]
# [derived] Structural zeros: the readout self-bills E_fixed + E_code as dynamic,
# so it carries no static seat.
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0

bits = 4                          # [measured p6 Table II] 4bO; also fixes the compare-phase weights 8/4/2/1
# [measured p6 Table II] the same core supply as `v_dd_core__V` (the macro config
# cross-checks them); Fig.12 shows the comparator input mirror conducting from it,
# not from the 0.1 V data line.
v_rail__V = 0.8
# [measured p7 Fig.18] PH0 (leakage compensation) then the four compare phases, MSB..LSB.
t_phase__ns = [5.0, 20.0, 20.0, 20.0, 20.0]
# [measured p7 Fig.18] t1..t4: each compare phase's start -> its own comparator
# output valid, MSB-first; T_AC(4) = PH0+PH1+PH2+PH3+t4 = 66 ns, T_AC(1) = PH0+t1 = 10 ns.
t_intrinsic__ns = [5.0, 1.0, 1.0, 1.0]
# [calibrated] mirror_scale and e_fixed_per_op__fJ solve ONE shared constraint
# pair (the Fig.19 per-conversion energy anchor and the Fig.11(b) code-spread
# window); bounds, solved values and residuals live in results.md.
mirror_scale = 0.1446             # [calibrated] comparator-side mirror scale: the fraction of the compared branch current the comparator draws over a phase
e_fixed_per_op__fJ = 392.5        # [calibrated] 4 standby REF branches + bias + comparator + leakage-compensation branch


# --- RS-CSA reference source (Iref) -- the ONE current the compare phases scale ---
# The readout takes a single reference current and weighs it by 2**(bits - p) in
# compare phase p, so the bank is single-tap; one row per quantization mode (this
# design point declares one), and the macro names the mode the source returns.
[cim_macro.reference_config]
# [derived] Structural zeros: the source is a bias branch of the readout, which
# self-bills it inside E_fixed, and Fig.19 itemises no reference block of its own;
# this scheme models no mismatch.
tolerance_sigma_relative = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0

# [derived] simulation-consistent operating point: Fig.11(a) annotates I_LSB = 7 uA
# and the measured-run instrument setting is unreported. Closes as
# 224 max MAC units * 0.5 uA per unit = 112 uA full scale over 2**4 = 16 codes
# -> 7 uA per code (top decision tap 15 * 7 = 105 uA). The 14 in rescale_factor
# is a separate quantity: MAC units per code.
i_refs__uA = [[7.0]]


# --- WL driver -- 1-bit ON/OFF DAC, one converter seat per word line ---
# The scan pattern is digital: output o raises word line o and every other line
# holds its off code, so a converter seat fires once per line per access.
[cim_macro.wl_dac_config]
_neurox_class = "GeneralVdacConfig"
# [measured p4 Fig.7(a)] binary WL drive: deselected -> 0 V, selected -> 0.6 V.
code_to_signal = [0.0, 0.6]
drive_thermal__V = 0.0            # [derived] structural zero: this scheme models no noise
# [assumed] PENDING RECAL: Fig.19 itemises no WL driver share, so both codes are
# structural zeros until the recalibration campaign solves the drive event.
code_to_per_op_energy__fJ = [0.0, 0.0]
# [derived] Structural zeros: the driver carries no area model and no static seat.
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- BL input driver -- 1-bit DAC, one converter seat per physical column ---
# The input level is HELD across the whole row scan, so a converter seat fires
# once per input vector, whichever level that vector puts on the column.
[cim_macro.bl_dac_config]
_neurox_class = "GeneralVdacConfig"
# [measured p4 Fig.7(a)] binary BL drive: IN = 0 -> 0 V, IN = 1 -> 0.3 V.
code_to_signal = [0.0, 0.3]
drive_thermal__V = 0.0            # [derived] structural zero: this scheme models no noise
# [assumed] PENDING RECAL: Fig.19 itemises no BL driver share, so both codes are
# structural zeros until the recalibration campaign solves the drive event.
code_to_per_op_energy__fJ = [0.0, 0.0]
# [derived] Structural zeros: the driver carries no area model and no static seat.
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- BL clamp -- ideal Thevenin VoltageDriver (r_out = 0), the array bl_driver ---
# Ideal source: the wire IR drop lives in the ARRAY, not the clamp. The whole
# input-branch conduction v_dd_bl__V * I_BL is macro-billed, so energy_per_op is 0.
[cim_macro.bl_driver_config]
# [derived] Structural zeros: this scheme models no mismatch and no noise, the
# macro bills the whole input branch, and the clamp carries no static seat.
r_out__MOhm = 0.0
offset_sigma__V = 0.0
thermal_sigma__V = 0.0
energy_per_op__fJ = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- SL driver -- ideal ground clamp (VoltageDriver held at 0 V), the array sl_driver ---
[cim_macro.sl_driver_config]
# [derived] Structural zeros: grounded rail, no billed branch; this scheme models
# no mismatch and no noise, and the clamp carries no static seat.
r_out__MOhm = 0.0
offset_sigma__V = 0.0
thermal_sigma__V = 0.0
energy_per_op__fJ = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- Mux & Driver -- flat seat, billed as pure static leakage ---
[cim_macro.mux_driver_config]
area_per_inst__um2 = 0.0          # [derived] the seat carries no area model
# [transcribed] Fig.19 Mux & Driver block power, flat across both sparsity points:
# 17.6% of 31.96 uW = 5.625 at 87.5%, 6.8% of 82.94 uW = 5.640 at 50%.
leakage_per_inst__uW = 5.63


# --- Timing & Mode Ctrl -- flat seat, billed as pure static leakage ---
[cim_macro.timing_ctrl_config]
area_per_inst__um2 = 0.0          # [derived] the seat carries no area model
# [transcribed] Fig.19 Timing & Mode Ctrl block power, flat across both sparsity
# points: 43.9% of 31.96 uW = 14.030 at 87.5%, 16.9% of 82.94 uW = 14.017 at 50%.
leakage_per_inst__uW = 14.03
