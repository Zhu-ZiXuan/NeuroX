# Nonideality-free ("all-off") policy for the ye2023jssc WH-2T1R CIM macro.
# What this scheme does and does not model: see the Scope section of
# docs/works/macro/cim/ye2023jssc/model.md.
#
# Pull with:
#   [policy]
#   _neurox_use = "policy.toml:policy"

[policy]
_neurox_class = "Ye2023JsscCimMacroPolicy"


# --- WH-2T1R array (lookup cell + solver chunk knob) ---
# solve_chunk_size = 0 solves the whole broadcast leading in one block.
[policy.array_policy]
solve_chunk_size = 0

[policy.array_policy.cell_policy]
_neurox_class = "Ye2023Jssc2t1rCellPolicy"


# --- RS-CSA current-domain quantizer ---
[policy.adc_policy]


# --- BL ideal-clamp seat (Thevenin VoltageDriver) ---
[policy.bl_driver_policy]
offset = false
thermal = false


# --- SL ideal-clamp seat ---
[policy.sl_driver_policy]
offset = false
thermal = false


# --- Mux & Driver flat static seat (UnmodeledBlock; source-free marker) ---
[policy.mux_driver_policy]


# --- Timing & Mode Ctrl flat static seat (UnmodeledBlock; source-free marker) ---
[policy.timing_ctrl_policy]
