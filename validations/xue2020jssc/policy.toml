# Xue2020 JSSC all-off nonideality policy.

[policy]
_neurox_class = "Xue2020JsscCimMacroPolicy"

# Bounds solver intermediates during ADC characterization.
[policy.array_policy]
solve_chunk_size = 1024

[policy.array_policy.cell_policy]
_neurox_class = "XbarCell1t1rLinearPolicy"

[policy.wl_dac_policy]
_neurox_class = "GeneralVdacPolicy"
drive_thermal = false

[policy.cablc_policy]
offset = false
thermal = false

[policy.cablc_vref_policy]
tolerance = false

[policy.sl_driver_policy]
offset = false
thermal = false

[policy.tmcsa_policy]
comparator_offset = false

[policy.tmcsa_iref_policy]
tolerance = false
