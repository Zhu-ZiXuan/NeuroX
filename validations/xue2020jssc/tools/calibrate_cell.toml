# Run-config for neurox.tools.calibrate_cell._1t1r on the xue2020jssc Detail cell.
#
# Calibrates the XbarCell1t1rDetail access-node condensation count (newton_iter_num) via
# step-ratio plateau, and in the SAME run extracts the linearized-cell fragment
# (XbarCell1t1rLinearConfig: per-(state, WL-level) chord conductance + BL-side
# drop fraction) at the nominal read OP. The two emitted TOML fragments (--output-dir):
#   - cell_detail_newton_iter_num.toml : the margined newton_iter_num;
#   - cell_linear.toml          : the Linear chord tables + WL threshold EXTRACTED
#                                 from the Detail source.
#
# WRITTEN BACK into params.toml [cim_macro.array_config.cell_config] (tagged [calibrated]):
# the runtime macro composes XbarArray1t1r with the Linear cell + a positive wire R, so the
# array solver uses BOTH the extracted chord conductance g_cell AND the BL-side drop fraction
# vx_ratio (the internal V_X node set by the access-NMOS series drop and the wire IR drop).
# The paper gives no absolute g_map and no device R-ratio, so both are campaign assumptions:
# the Detail extraction gives g_cell_on ~= [5.0, 94.6] uS (the LRS chord sags ~5.4 % from the
# access-NMOS series drop) and vx_ratio_on ~= [0.997, 0.943]. The emitted cell_linear.toml
# carries a header pointing array_config.cell_config at itself, and the newton_iter_num fragment
# characterizes the Detail-source access-node plateau.
#
# The Detail cell under calibration is the shared source model params_detail.toml;
# the OP is the runtime read point (v_bl = V_BLC = 0.29 V, v_sl = 0 V) with the WL
# off/on levels matching the runtime WL DAC (0.0 / 0.9 V).
#
# Run:
#   python -m neurox.tools.calibrate_cell._1t1r \
#       --config validations/xue2020jssc/tools/calibrate_cell.toml \
#       --device cpu --output-dir log/calibration/xue2020jssc

[cell_config]
# Pull the Detail cell fragment from the shared source model.
_neurox_use = "params_detail.toml:cim_macro.array_config.cell_config"

[grid]
# Terminal-voltage sweep spanning the read window; the extraction OP sits inside it.
v_terminal_min__V = 0.0
v_terminal_max__V = 0.5
n_terminal = 9
v_wl_off__V = 0.0                 # WL off (NMOS cut off) -- matches wl_dac code 0
v_wl_on__V = 0.9                  # WL on -- matches wl_dac code 1 (V_WL placeholder)
v_bl_op__V = 0.29                 # nominal read voltage = V_BLC (the Linear chord OP)
v_sl_op__V = 0.0                  # source line grounded

[sweep]
candidates = [2, 4, 6, 8, 10, 12]
ratio_threshold = 0.5             # step-ratio plateau threshold (methodological)
reltol = 1e-2                     # relative-residual guard (methodological, not chip-tuned)
margin = 1                        # +1 safety margin on the picked newton_iter_num

[runtime]
dtype = "float32"                 # match the fp32 production dtype (the runtime Linear cell is fp32)
