# Xue2020 JSSC array-solver calibration.

[macro]
config_files = ["../params.toml"]
config_section = "cim_macro"
policy_file = "../policy.toml"
policy_section = "policy"
solver_section = "array_config.solver_config"

[workload]
active_inputs = 9
weight_samples = 2
input_samples_per_weight = 2
batch_w = 2

[sweep]
outer_candidates = [1, 2, 3, 4, 5, 6]
inner_candidates = [1, 2, 3, 4]
inner_ref = 4
ratio_threshold = 0.5
reltol = 1e-2
outer_margin = 1
inner_margin = 0

[runtime]
dtype = "float32"
seed = 0
