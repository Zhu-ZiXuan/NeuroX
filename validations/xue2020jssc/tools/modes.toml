# Quantization mode set for the xue2020jssc sub-array -- the single source
# consumed by calibrate_adc.threshold_probe (window per mode) and
# calibrate_adc.rescale_fit (mode list + per-mode fit window). This scheme has ONE
# mode (reference_config.mode_num = 1): a 3-bit unsigned-magnitude TMCSA whose
# signed MAC the sign bit recovers outside the ADC.
#
# quantization_input_range = [-8, 7]: the canonical mid-zero window holding the
# attainable signed output +-7 (the -8 level is a phantom the sign-magnitude
# encoding never emits). The converter discriminates the magnitude, whose grid
# tops out at 7, so threshold_probe places exactly 2**n_bits - 1 = 7 mid-point
# taps (matching reference_config.tap_num). A single placeholder layer maps onto
# the mode (a full deployment mode set is a consumer-side mode_derive artifact;
# this scheme calibrates its lone mode).

[[modes]]
quantization_mode = 0
quantization_input_range = [-8, 7]
layer_num = 1

[layers]
"xue2020jssc.mac" = 0
