# Run-config for neurox.tools.calibrate_adc.rescale_fit on the xue2020jssc macro.
#
# Stage 2 of the ADC pipeline: fit the scalar rescale_factor of the consumer model
# |M_ideal| ~= code * rescale_factor per ADC mode, emitting the
# [[cim_macro.adc_calibration]] fragment.
#
# Divisibility: like its Stage-1 partner (calibrate_threshold.toml), rescale_fit builds
# the lossless to_ideal() twin and drives paired stimulus through the generic row-block
# serialization, which CEIL-divides + masks (a short final block covers rows 252..255)
# rather than requiring row_num % active_row_num == 0.
# For this single-mode design the ladder is sized so the ADC
# code IS the integer MAC magnitude, so the fitted consumer rescale_factor is ~1.0
# (params.toml [[cim_macro.adc_calibration]]).
#
# NOT YET a drop-in replacement for calibrate.py at THIS config: same digit-axis gap as its
# Stage-1 partner -- the generic testbench programs a single-digit (col_num, 1, row_num)
# ternary tensor, while the paper macro is w_digit_num=2 (program expects
# (col_num, 2, row_num)). Applies as-is once the testbench emits the macro's full digit
# layout (or the macro is run at a w_digit_num=1 config).
#
# Run (AFTER threshold_probe):
#   python -m neurox.tools.calibrate_adc.rescale_fit \
#       --config validations/xue2020jssc/tools/calibrate_rescale.toml --device cpu

# Top-level scalar (must precede the first table header): the mode-set source.
modes_file = "modes.toml"

[macro]
input_num = 256
output_num = 128
config_files = ["../params.toml"]
config_section = "cim_macro"
policy_file = "../policy.toml"
policy_section = "policy"

[stimulus]
seed = 0
w_densities = [0.5, 1.0]          # ternary non-zero densities (one weight group each)
x_densities = [0.5, 1.0]
patterns_per_density = 8
x_batch = 8
