# Detail-cell calibration SOURCE model for the xue2020jssc SINWP 1T1R sub-array.
#
# This is NOT a runtime macro config (the shipped, buildable macro is the Linear
# ../params.toml). It is the pre-linearization PHYSICAL device model the offline
# calibration tools operate on:
#
#   - calibrate_cell (tools/calibrate_cell.toml) pulls the Detail cell_config
#     below (via _neurox_use) and extracts the exact Linear chord g_cell_on/off +
#     vx_ratio at the nominal OP (v_bl = V_BLC = 0.29 V, v_sl = 0 V) plus the
#     Detail newton_iter_num -> written back into ../params.toml's [cim_macro.array_config.cell_config].
#   - calibrate_solver (tools/calibrate_solver.toml) locates the array-solver
#     table at solver_section = "array_config.solver_config".
#
# The RUNTIME macro composes an XbarArray1t1r with a DC solver and the same wire
# ladder, so the array-solver calibration is GENUINE: this Detail array
# mirrors ../params.toml's wire geometry (BL/SL first 20 Ohm, segment 5 Ohm) so the
# calibrate_solver-picked (n_outer, n_inner) transfer to the runtime array. It is
# also a config-complete xbar the shipped run-config resolves against (reactivating
# tests/tools/test_calibrate_solver.py::TestShippedRunConfig). The section
# deliberately carries NO macro-level _neurox_class: it is a calibration fragment
# source, not a dispatchable CimMacro.

[cim_macro]

# --- Activation limit (geometry is supplied to the macro constructor) ---
max_active_num = 9               # [measured p206] input positions selected per conversion


# ===========================================================================
# Array (kernel XbarArray1t1r) -- IR-drop 1T1R pure array: cells + wire + solver
# ===========================================================================
[cim_macro.array_config]
area_per_inst__um2 = 0.0          # [derived] un-extracted
leakage_per_inst__uW = 1.0        # [derived] small array+wire static placeholder
latency_per_op__ns = 1.0          # [derived] per-VMM core latency placeholder

# --- Layout pitch --- [derived] 28nm-class pitch placeholders
row_first_space__um = 1.000
row_cell_space__um = 0.040
col_first_space__um = 1.000
col_cell_space__um = 0.040

# --- BL / SL / WL wire segments ---
# [assumed] The paper gives NO wire R/C. Mirrors ../params.toml: BL/SL
# first-segment R = 20 Ohm = 2.0e-5 MOhm, cell-to-cell R = 5 Ohm
# = 5.0e-6 MOhm, small per-segment caps. Matching the runtime array is what makes
# the calibrate_solver (n_outer, n_inner) transfer valid.
bl_first_r__MOhm = 2.0e-5
bl_first_c__fF = 0.200
bl_segment_r__MOhm = 5.0e-6
bl_segment_c__fF = 0.008
sl_first_r__MOhm = 2.0e-5
sl_first_c__fF = 0.200
sl_segment_r__MOhm = 5.0e-6
sl_segment_c__fF = 0.008
wl_first_r__MOhm = 2.0e-5
wl_first_c__fF = 0.200
wl_segment_r__MOhm = 5.0e-6
wl_segment_c__fF = 0.008


[cim_macro.array_config.cell_config]
_neurox_class = "XbarCell1t1rDetailConfig"

# --- Access-NMOS sizing --- [derived] 28nm-class placeholders
access_nmos_W__um = 0.150
access_nmos_L__um = 0.028

# --- Per-cell node-to-ground capacitances [fF] --- [derived] un-extracted
c_bl__fF = 0.2
c_x__fF = 0.3
c_sl__fF = 0.1
c_wl__fF = 0.2

# --- RRAM design window + state map ---
# [assumed] SLC 1T1R at the campaign's R-ratio-20 design point: g_lrs ~ 100 uS
# (R_LRS ~ 10 kOhm) => g_hrs ~ 5 uS. State 0 = HRS, 1 = LRS. The paper gives
# neither an absolute g scale nor the fabricated device's R-ratio -- Fig.17 (p210)
# only sweeps read yield over R-ratio 10, 15, 20, 30, 40, 50 -- so both are
# campaign assumptions. g_min = 5 uS via the rram override below (the shared preset
# floor is 10 uS).
rram_g_max__uS = 100.0
state_to_g_map__uS = [5.0, 100.0]

# --- Per-cell access-node Newton count ---
# [calibrated] calibrate_cell: 9 Newton steps for the Detail access-node
# solve to converge the chord extraction at V_BLC = 0.29 V.
newton_iter_num = 9


[cim_macro.array_config.cell_config.rram_config]
_neurox_use_preset = "process/rram:default"
# [derived] Per-paper override of the preset g_min floor (10 uS) so the
# R-ratio-20 HRS (5 uS) is programmable + un-clamped. Inline keys win; the shared
# preset is NOT modified.
g_min__uS = 5.0


[cim_macro.array_config.cell_config.nmos_config]
_neurox_use_preset = "process/mos:nmos_28_rvt"


[cim_macro.array_config.solver_config]
_neurox_class = "NestedParallelRailSolverConfig"
# [derived] seed; calibrate_solver (tools/calibrate_solver.toml) re-picks the pair.
n_outer = 5
n_inner = 1
