# Paper-design params for the Xue et al. (JSSC 2020) SINWP 1T1R CIM sub-array —
# ONE 256x512 sub-array of the 1-Mb macro. Spec:
# docs/works/macro/cim/xue2020jssc/model.md; measured outcomes: results.md.
#
# 3-bit sign-magnitude weights (sign + 2 radix-2 magnitude digits) on P/N cell
# pairs, 2-bit input (K=2, two serial single-bit WL sub-phases LSB first), 3-bit
# unsigned-magnitude ADC output.
#
# Every value that names a physical quantity carries a provenance tag, inline or in
# the comment block directly above it; the legend is in docs/validation/campaigns.md.
# Page numbers in [measured pN ...] are the printed JSSC page numbers. Two tags do
# the campaign-specific work here: [transcribed] marks the two peripheral seats
# taken verbatim from a Fig.18 block share (control, reference), and [assumed]
# marks every modeling assumption the campaign owns -- a known-unknown given a
# value, NEVER reverse-solved to hit a gate (the wire R/C estimates included: the
# solver needs R > 0, so a true zero is never an option in code).
#
# ENERGY-BASIS accounting: the profiler reports energy. Static energy per access =
# leakage_power * t_cycle (the macro logs latency = t_cycle * serial, so
# leakage_energy = leakage_power * total_latency already integrates over t_cycle);
# dynamic energy per access = per-VMM dynamic / mux_factor. The per-access target
# is 32.06 pJ = 5.13 mW / 8 sub-arrays / 20 MHz. Only two peripheral blocks are
# [transcribed] from Fig.18 (Control 29.2 %, Reference 23.7 %); the read path (array /
# cablc / dswct / sinwp_sc / pn_isub / tmcsa) conduction is pure physics, its
# static seats are declared small/zero, and its capacitive / per-op remainders are
# [calibrated] to the paired-slice residuals inside declared plausibility bounds.
# See anchors.toml for the target, shares (informational), and declared
# conventions.
#
# Pull this fragment from a user config with:
#   [cim_macro]
#   _neurox_use = "params.toml:cim_macro"   # (path relative to your file)

[cim_macro]
_neurox_class = "Xue2020JsscCimMacroConfig"

# --- Activation limit (one 256-input x 128-output macro) ---
# The owner supplies input_num=256 and output_num=128 at construction. Internally,
# row_num=256 and col_num=128, yielding 512 physical columns and 4 CIM-IOs.
# [measured p206] 3x3-kernel row-block size activated per conversion ("a maximum of
# nine WLs were turned on in this article"); the engine (not the macro) serializes
# across row blocks. Instantaneous conducting rows are data-driven (WL on iff that
# input bit = 1).
max_active_num = 9

# --- Weight / input geometry (fixed by the DSWCT MSB/LSB two-leg structure) ---
w_digit_num = 2                   # [measured p206] 2 magnitude digits (MSB/LSB two-mirror)
w_digit_radix = 2                 # [measured p206] single-bit magnitude cell (LRS/HRS)
input_bit_num = 2                 # [measured p206] K=2 input bits -> 2 serial WL sub-phases, LSB first
mux_factor = 32                   # [measured p207] 32:1 column MUX; io_num = col_num // mux_factor = 4

# --- DSWCT / SINWP-SC ratio anchors (per-digit / per-bit ratios DERIVED downward) ---
# Per-digit DSWCT mirror ratio r_d = dswct_ratio_msb * radix^(d-(D-1)), LSB-first
# d=0..1 -> [0.25, 0.5]; per-input-bit SINWP-SC leg ratio s_k = sc_ratio_msb *
# 2^(k-(K-1)) -> [0.25, 0.5]. Composite BL->I_SUB coeff r_d*s_k over (digit, bit) =
# (1/16, 1/8, 1/8, 1/4), the paper's Fig.7 net transfer.
dswct_ratio_msb = 0.5             # [measured p206 Fig.6(a)] MSB-leg mirror ratio (1/k * 2 at k = 4)
sc_ratio_msb = 0.5                # [measured p206 Fig.7] MSB-bit SINWP-SC combine ratio (live leg 2x the held leg)

# --- Conduction windows [ns] (dynamic-energy only) + static time base ---
# One sample window per SAMPLED input bit (length K-1 = 1: bit 0 held on the
# SINWP-SC caps); the live bit (K-1) conducts in t_other = t_settle +
# sum(adc.step_latency) = 2.66 + 9.34 = 12.0 ns. conduction span = 2.6 + 12.0 =
# 14.6 ns = T_AC, comfortably inside t_cycle.
t_sample__ns = [2.6]              # [assumed] IN[0] sample sub-phase (non-sensing T_AC budget)
t_settle__ns = 2.66               # [assumed] tail non-sensing settle window (T_AC non-sensing part)
# [derived] 50 ns measurement period = 1 / 20 MHz; the static-energy time base. The
# macro logs latency = t_cycle * serial, so leakage_energy = leakage_power *
# total_latency integrates static power over the whole period (=> static energy per
# access = leakage_power * t_cycle). Must be >= the conduction span (14.6 ns).
t_cycle__ns = 50.0

# --- Supply voltage ---
v_dd__V = 1.0                     # [measured p209] 1.0 V supply rail (every channelled branch bills across it)

# --- Transcribed per-op dynamic constant ---
# [transcribed] Control per-ACCESS dynamic energy. Control (address decode, CMD
# precharge, timing; NO CMD capacitance modeled anywhere -- folded here) is not
# modeled from physics, so its Fig.18 (p210) 29.2 % share = 0.292 * 32.06 pJ =
# 9362.25 fJ/access is taken verbatim as a PURE per-op constant (100 % dynamic; the
# control seat below carries zero leakage). e_control fires once per access.
e_control_per_op__fJ = 9362.25

# --- PPA: the macro-owned lump ---
# The DSWCT / SINWP-SC / PN-ISUB static seats live in their own module configs
# below; this lump carries only the un-attributed macro remainder. Area
# un-extracted.
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# --- Quantization modes (macro-level; one entry per reference ladder row) ---
# The TMCSA is a 3-bit unsigned-magnitude quantizer behind a sign bit, so the
# attainable signed output is +-7 and the canonical mid-zero window that holds it
# is [-8, 7] (the -8 level is a phantom the sign-magnitude encoding never emits).
# The converter itself discriminates magnitudes over its seven taps, so the ADC
# input code range is [0, 7]. Single operating point (reference mode_num = 1).
# [assumed] rescale 1.0 -- the mid-point thresholds are sized so the code IS the
# integer MAC magnitude, i.e. the macro's code already is the ideal macro's code.
[[cim_macro.modes]]
quantization_input_range = [-8, 7]
adc_input_code_range = [0, 7]
max_bits_rescale_factor = 1.0


# ===========================================================================
# Array (kernel XbarArray1t1r) -- IR-drop 1T1R pure array: cells + wire + solver
# ===========================================================================
# Each WL sub-phase is one DC solve at the position-dependent wire IR drop,
# returning the per-column BL port current I_DL. The array is a REPORTER: it bills
# ONLY its wire / cell capacitive cycling on its own module row; the macro bills
# the whole input branch V_DD*I_DL on the cablc channel (the array caps row + that
# channel fold into the cablc+dswct pair slice).
[cim_macro.array_config]
area_per_inst__um2 = 0.0          # [derived] un-extracted (device area folds into the macro lump)
# [assumed] Read-path static seat = 0: read-path static is declared small/zero,
# NEVER solved to fill the total. The cablc slice is dynamic-dominated.
leakage_per_inst__uW = 0.0
# [derived] latency_per_op = 0: the MACRO is the sole latency emitter
# (t_cycle * serial); the array must emit no latency event.
latency_per_op__ns = 0.0

# --- Layout pitch [um] --- [derived] 28nm-class pitch placeholders (must be > 0)
row_first_space__um = 1.000
row_cell_space__um = 0.040
col_first_space__um = 1.000
col_cell_space__um = 0.040

# --- BL / SL / WL wire segments ---
# [assumed] The paper gives NO wire resistance/capacitance. R: the solver uses
# g = 1/R so R MUST be > 0 (a true zero is nan; a small positive value is the
# correct "near-ideal" path, NEVER a code hardcode). BL/SL first-segment R = 20
# Ohm = 2.0e-5 MOhm, cell-to-cell R = 5 Ohm = 5.0e-6 MOhm. The solver computes the
# position-dependent IR drop; the Linear cell + wire R is a linear system (fast,
# near-exact).
# [calibrated] Wire caps (dynamic-energy only), solved at the round basis
# (n_w 32 weight draws x n_x 256 inputs x 4 rounds, seed 0) under the
# cablc+dswct pair caliber. The declared per-segment relative structure is kept;
# one uniform scale x0.69561 (shared with the cell node caps below) seats the
# array cap row at the whole pair-1 residual 0.2514 pJ/access (26.4 % share minus
# the .cablc + dswct conduction; the dswct c_load and any CMD per-op stay 0).
# Plausible at 55 nm: 0.1391 fF over the ~1 um lead-in and 5.565 aF per 0.04 um
# cell pitch are both ~0.14 fF/um, inside the 0.05-0.3 fF/um mid-metal band.
bl_first_r__MOhm = 2.0e-5
bl_first_c__fF = 0.1391216
bl_segment_r__MOhm = 5.0e-6
bl_segment_c__fF = 0.0055648638
sl_first_r__MOhm = 2.0e-5
sl_first_c__fF = 0.1391216
sl_segment_r__MOhm = 5.0e-6
sl_segment_c__fF = 0.0055648638
# WL is gate-only (carries no DC current); R is nominal (positive) and only its
# cap cycles. [assumed] R same-class estimate; caps under the same
# [calibrated] x0.69561 campaign scale.
wl_first_r__MOhm = 2.0e-5
wl_first_c__fF = 0.1391216
wl_segment_r__MOhm = 5.0e-6
wl_segment_c__fF = 0.0055648638


# ---------------------------------------------------------------------------
# Linearized 1T1R cell (XbarCell1t1rLinear) -- the programmable weights
# ---------------------------------------------------------------------------
# The cell tables encode the g_map (chord conductance per weight state / WL level)
# plus the BL-side drop fraction the solver uses for the internal V_X node.
[cim_macro.array_config.cell_config]
_neurox_class = "XbarCell1t1rLinearConfig"

# --- Per-cell node-to-ground capacitances [fF] ---
# [calibrated] Solved at the round basis (n_w 32 x n_x 256 x 4 rounds, seed 0)
# under the cablc+dswct pair caliber: the declared per-node relative structure is
# kept, and the same uniform x0.69561 scale as the wire caps seats the array cap
# row at the pair-1 residual. Plausible at 55 nm: 0.07-0.21 fF junction /
# RRAM-electrode / gate node caps (the gate at the low edge, a near-minimum
# access device).
c_bl__fF = 0.1391216
c_x__fF = 0.20868239
c_sl__fF = 0.069560798
c_wl__fF = 0.1391216

# --- Chord conductance tables [uS], indexed by weight-state (0 = HRS, 1 = LRS) ---
# WL off cuts the access transistor -> only the tiny off-branch leakage conducts;
# WL on the RRAM state sets the branch chord g_cell = I / (V_BL - V_SL). [assumed]
# SLC 1T1R R-ratio ~20 (g_lrs ~ 100 uS, g_hrs ~ 5 uS). The paper reports NEITHER an
# absolute g_LRS/g_HRS NOR the fabricated device's R-ratio: Fig.17 (p210) sweeps
# read yield and system accuracy over R-ratio 10, 15, 20, 30, 40, 50 in a 32K-point
# Monte Carlo, and 20 is this campaign's mid-sweep pick. Both the ratio and the
# absolute scale are therefore campaign assumptions.
# [calibrated] calibrate_cell: Detail-derived chord at the nominal read OP (V_BL =
# V_BL_CLAMP = 0.29 V, V_SL = 0 V, WL off/on = 0.0/0.9 V). g_cell = I / (V_BL -
# V_SL). The LRS chord sags ~5.4 % below the round 100 uS (state 1 on) from the
# access-NMOS series drop; the off-state chords are the tiny cut-off leakage.
# Source: tools/calibrate_cell.toml -> tools/params_detail.toml.
g_cell_off_table__uS = [0.00010173896263385642, 0.00010276662892308729]
g_cell_on_table__uS = [5.002494516043828, 94.57440211855133]

# --- BL-side drop fractions vx_ratio = (V_BL - V_X) / (V_BL - V_SL) ---
# [calibrated] calibrate_cell: Detail-derived BL-side drop fraction at the same
# OP; feeds the solver's internal V_X node.
vx_ratio_off_table = [2.0376567182800837e-05, 1.056440945260427e-06]
vx_ratio_on_table = [0.9970223060166784, 0.9428045968043393]

# --- Analog WL level above which the access device counts as on ---
# [calibrated] calibrate_cell: midpoint of the off/on WL grid (0.45 V).
v_wl_on_threshold__V = 0.45


# ---------------------------------------------------------------------------
# Array DC solver (NestedParallelRailSolver) -- outer V_clamp / inner wire Newton
# ---------------------------------------------------------------------------
# The Linear cell + wire R is a linear system, so the solve is fast + near-exact;
# the nested iteration counts are genuinely used all the same (the wire IR drop
# couples BL/SL). [calibrated] calibrate_solver.nested (step-ratio plateau +
# residual guard, all-off, active_rows=9, this wire ladder): plateau at
# (n_outer=3, n_inner=3), recommended with +1 outer margin. Drive the tool at
# inst_shape=(): its CLI forces inst_shape=[batch_w], which collides with this
# macro's ADC per-instance layout at batch_w>1 and mis-shapes program() at
# batch_w=1, while its sweep engine drives cleanly at inst_shape=().
[cim_macro.array_config.solver_config]
_neurox_class = "NestedParallelRailSolverConfig"
n_outer = 4                       # [calibrated] outer clamp-voltage Newton steps (plateau 3 + margin 1)
n_inner = 3                       # [calibrated] inner wire/cell coupled Newton steps (plateau 3)


# ===========================================================================
# WL DAC -- 1-bit ON/OFF word-line driver (K serial single-bit sub-phases)
# ===========================================================================
[cim_macro.wl_dac_config]
_neurox_class = "GeneralVdacConfig"
# [measured p206] binary WL drive: OFF -> 0 V, ON -> V_WL. [assumed] V_WL 0.9 V (the
# paper does not give the WL on-voltage). latency_per_op = 0 so the WL sub-phase
# folds into t_cycle (the macro is the sole latency emitter).
code_to_signal = [0.0, 0.9]
drive_thermal__V = 0.0
energy_per_op__fJ = 0.0
latency_per_op__ns = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# ===========================================================================
# CABLC BL clamp -- ideal Thevenin VoltageDriver (R_out = 0), the array bl_driver
# ===========================================================================
[cim_macro.cablc_config]
# Column-MUX time-shared: fabricated at inst_shape (n_io, 2, 2) = 16 devices per
# sub-array (4 per CIM-IO: P/N x MSB/LSB). Ideal source (r_out = 0): the wire IR
# drop lives in the ARRAY, not the clamp. The whole input-branch conduction
# V_DD*I_DL is billed by the macro cablc channel, so energy_per_op MUST be 0
# (the CMD precharge is under the control channel).
r_out__MOhm = 0.0
offset_sigma__V = 0.0
thermal_sigma__V = 0.0
energy_per_op__fJ = 0.0
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0: read-path static is declared small/zero,
# NEVER solved to fill the total. The CABLC slice is dynamic-dominated.
leakage_per_inst__uW = 0.0


# ===========================================================================
# CABLC reference source -- dedicated single-tap Vref (the BL clamp reference)
# ===========================================================================
# The macro's own reference source: its sole tap is read per solve and fed to
# the array's bl_driver as its Thevenin reference. The SL has no reference
# source -- it is a direct ground tie (a plain 0 V tensor in code).
[cim_macro.cablc_vref_config]
# [measured p210 Fig.14] BL clamp reference tap ~0.29 V, read off the target-V_BLC
# line and therefore a known-unknown at graph precision. The per-cell V_BL droops
# below it by the wire IR drop the solver computes.
v_refs__V = [0.29]
tolerance_sigma_relative = 0.0
noise_sigma_relative = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0        # [assumed] read-path static seat = 0


# ===========================================================================
# SL driver -- ideal ground clamp (VoltageDriver held at 0 V), the array sl_driver
# ===========================================================================
[cim_macro.sl_driver_config]
# Per-group SL clamp (inst_shape mirrors cablc), driven at V_SL = 0 in the solve
# (paper topology: BL -> RRAM -> SL(GND); the 0 V reference is a plain tensor).
r_out__MOhm = 0.0
offset_sigma__V = 0.0
thermal_sigma__V = 0.0
energy_per_op__fJ = 0.0
area_per_inst__um2 = 0.0
leakage_per_inst__uW = 0.0


# ===========================================================================
# Kernel SAR ADC -- value converter only (SarIadc; energy-silent in this scheme)
# ===========================================================================
# The macro builds this ADC with enable_energy_record=false AND
# enable_latency_record=false: it converts values only. The conversion energy is
# billed phase-resolved by the scheme tmcsa_config module below, so the kernel
# energy knobs (v_rail, t_conduct, e_fixed) are inert for this scheme.
[cim_macro.adc_config]
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0. The conversion dynamic energy is billed
# on the scheme tmcsa module row.
leakage_per_inst__uW = 0.0

bits = 3                        # [measured p209] 3-b sensing, seven references I_REF[6:0]
margin_gain = 3.0                 # [measured p208] triple margin (3x the SM in PH3)

# [derived] Kernel conduction knobs, INERT here (enable_energy_record=false); the
# scheme tmcsa module owns the conversion billing.
v_rail__V = 1.0
t_conduct_per_step__ns = [3.16, 3.07, 3.11]
# [measured p209] STP1/2/3 per-step sensing durations; sum 9.34 ns = the
# sensing part of T_AC. As step_latency they feed t_other (t_other = t_settle +
# sum = 2.66 + 9.34 = 12.0 ns). The macro builds the ADC instance with
# enable_latency_record=false so it emits no latency event -- the macro is the
# sole latency emitter.
step_latency__ns = [3.16, 3.07, 3.11]

# [derived] Kernel per-step constant, INERT here: the billing duty for this
# scheme belongs to tmcsa_config.e_fixed_per_op__fJ below.
e_fixed_per_op__fJ = 0.0

# --- Nonideality sigmas (gated by policy; all-off here) ---
comparator_offset_sigma__uA = 0.0
coupling_mismatch_sigma__uA = 0.0


# ===========================================================================
# TMCSA -- phase-resolved conversion-billing module (one unit per CIM-IO)
# ===========================================================================
# Bills the conversion energy from (i_sub, raw codes, reference ladder) after
# the kernel ADC returns: per step s, the materialized phase branches
# i_ph2 = 3*(i_sub + i_ref_path[s]) over t_ph2[s] and i_ph3 = 2*(i_sub +
# i_ref_path[s]) over t_ph3[s], plus e_fixed per step. The per-step reference
# path is recovered from the final code through the structural tap LUT.
[cim_macro.tmcsa_config]
# [calibrated] Solved against the tmcsa 9.3 % slice = 2.9816 pJ/access at the
# round basis (n_w 32 x n_x 256 x 4 rounds, seed 0), jointly with e_fixed_per_op
# below. The Fig.10(b) as-drawn PH2:PH3 ratio 92:158 is kept (PH2 < PH3; the
# paper gives no numeric phase data); both windows scale x1.54401 above the
# as-drawn widths (~0.278 / ~0.463 of the sourced steps 3.16, 3.07, 3.11), so
# PH2+PH3 occupy 74.1 % of each step and PH1/PH4 the rest (per step t_ph2 + t_ph3
# <= step_latency holds). TENSION vs the as-drawn 48 % occupancy: with e_fixed at
# its ~150 fJ/step plausibility ceiling the slice cannot close at the as-drawn
# widths (that would need e_fixed = 185 fJ); the window widening is the residual
# compromise.
t_ph2_per_step__ns = [0.878232, 0.853219, 0.864336]
t_ph3_per_step__ns = [1.463719, 1.422031, 1.440559]
# [calibrated] Same joint fit: data-independent per conversion-STEP constant
# (each step's PH4 latch + coupling-cap events; the PH1 bias conduction folded
# here), seated at the top of its plausibility band (latch + coupling caps +
# PH1 bias: tens-to-~150 fJ per step at 55 nm).
e_fixed_per_op__fJ = 150.0
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0: declared small/zero, not solved.
leakage_per_inst__uW = 0.0


# ===========================================================================
# Reference -- shared static current-reference source (Iref)
# ===========================================================================
# The 7 mid-point ADC thresholds I_REF[6:0] are sourced by a static
# Iref (PPA leakage only, no forward path), shared by the 4 TMCSAs, one
# instance per sub-array. The [mode, tap] bank is sliced to a 1-D ladder per call;
# tap_num MUST == 2**adc_config.bits - 1 = 7, mode_num = 1.
[cim_macro.reference_config]
area_per_inst__um2 = 0.0
# [transcribed] Reference is not modeled from physics, so its Fig.18 (p210) 23.7 %
# share is taken verbatim as a 100 %-static seat: 0.237 * 641.25 uW = 151.97625 uW
# (= 0.237 * 32.06 pJ / t_cycle = 7.599 pJ / 50 ns). A block power adopted as a
# constant, not a residual fit; calibrate.py confirms the share.
leakage_per_inst__uW = 151.97625

# [calibrated] calibrate.py: 7 mid-point thresholds I_REF[j] =
# 0.5*(I_SUB(MAC=j) + I_SUB(MAC=j+1)) at THIS geometry (Linear cell, calibrated
# chord + solver n_outer=4/n_inner=3, active_row_num=9), re-derived by driving the
# macro through the full array IR-drop solve and probing the pre-ADC i_sub
# staircase. The ladder TRACKS the chord scale. Staircase monotonic; the ladder
# verifies code == MAC magnitude (codes 0..7). The config enforces
# strictly-increasing equal-length rows; length 7 pins against 2**bits-1.
i_refs__uA = [[0.808528, 2.425583, 4.042638, 5.652523, 7.255236, 8.857949, 10.451908]]

# --- Nonideality sigmas (gated by policy; all-off here) ---
tolerance_sigma_relative = 0.0
noise_sigma_relative = 0.0


# ===========================================================================
# Control -- static-PPA seat for the (functionally unmodeled) control block
# ===========================================================================
[cim_macro.control_config]
area_per_inst__um2 = 0.0
# [assumed] Pure per-op control caliber: the paper publishes no dyn/static split, so
# the campaign bills the full 29.2 % share as the dynamic e_control_per_op above and
# the static seat is zero. A declared convention, not a fit.
leakage_per_inst__uW = 0.0


# ===========================================================================
# DSWCT -- digit-weighted current-mirror bank module (one bank per (IO, P/N))
# ===========================================================================
# Self-bills its rail conduction V_DD * |I_WDL| * window on its own module row;
# the digit ratios derive from dswct_ratio_msb above.
[cim_macro.dswct_config]
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0: declared small/zero, not solved.
leakage_per_inst__uW = 0.0
# [assumed] Output-leg load cap held at 0.0: the cablc+dswct pair residual seats
# wholly on the array cap network (a ~256x512-node grid against 16 single-node
# output legs here), so this stays a declared small/zero seat.
c_load__fF = 0.0


# ===========================================================================
# SINWP-SC -- sample-and-hold combine module (one unit per (IO, P/N) lane)
# ===========================================================================
# Self-bills its held/live leg conduction (suffix-sum window) on its own module
# row; the bit ratios derive from sc_ratio_msb above.
[cim_macro.sinwp_sc_config]
# [calibrated] Sample-and-hold cap per combine leg, solved at the round basis
# (n_w 32 x n_x 256 x 4 rounds, seed 0) under the sinwp_sc+pn_isub pair caliber.
# The pair-2 residual 0.2300 pJ/access (11.4 % share minus the leg + 3-branch
# conduction, the kept 5 fJ comparator per-op staying inside the measured PN-ISUB
# row) seats the cap term: 16 c_hold*v_dd^2 events per access (x_bits x IO x P/N)
# -> c_hold = 14.3768 fF. Plausible at 55 nm: inside the 10-100 fF S/H band;
# kT/C ~ 0.54 mV rms at 300 K.
c_hold__fF = 14.3768
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0: declared small/zero, not solved.
leakage_per_inst__uW = 0.0


# ===========================================================================
# PN-ISUB -- P/N subtractor module (bias/icm rails + sign comparator)
# ===========================================================================
# Self-bills its 3-branch conduction over t_other plus the per-decision
# comparator energy on its own module row.
[cim_macro.pn_isub_config]
# [assumed] PN-ISUB comparator per-decision energy (data-independent), billed per
# column. A small physical latch/decision cost at a plausible fJ scale, NOT a
# budget residual: the paper gives no comparator energy, and the sc+pn pair
# residual seats on the sinwp_sc c_hold above.
e_per_op__fJ = 5.0
area_per_inst__um2 = 0.0
# [assumed] Read-path static seat = 0: declared small/zero, not solved.
leakage_per_inst__uW = 0.0
