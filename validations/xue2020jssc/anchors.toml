# Validation anchors for the xue2020jssc SINWP 1T1R CIM sub-array.
#
# The citable paper target, the informational Fig.18 shares, and the
# DECLARED conventions that validate.py checks params.toml against. These are
# inputs to the validation; calibrated values state their target explicitly. The
# single HARD GATE is the TOTAL energy per access; everything else is
# informational. Misses are reported honestly in results.md.
#
# Every value carries a provenance tag; the legend is in docs/validation/campaigns.md.
# Page numbers in provenance tags are the printed JSSC page numbers. [reported],
# [simulated], and [measured] distinguish design facts, paper simulations, and
# fabricated-silicon measurements.

# ===========================================================================
# Hard-gate target -- total energy per access
# ===========================================================================
[target]
# [simulated p210] Total macro power at the paper's simulated 2-b-input / 3-b-weight
# operating point. It appears in Section V-A immediately before the explicitly
# simulated Fig.18 breakdown; the paper does not identify it as a silicon measurement.
total_macro__mW = 5.13
op_frequency__MHz = 20.0          # [simulated p210] simulated access rate
# [reported p211 Fig.20(c)] The macro contains eight independent 256x512 sub-arrays.
sub_array_num = 8
input_bits = 2                    # [reported p210] power-evaluation input precision
weight_bits = 3                   # [reported p210] power-evaluation weight precision
vdd__V = 1.0                      # [reported p209] simulation supply; [measured p211] nominal test supply
# [derived] 5.13 mW / 8 sub-arrays / 20 MHz = 32.0625 pJ (= 32062.5 fJ) per
# independent sub-array. One access is one column-MUX slot conversion set; a full vec_mat_mul
# over all col_num logical columns is mux_factor serial accesses.
per_access__fJ = 32062.5

# ===========================================================================
# The single hard gate
# ===========================================================================
[gate]
# [assumed] Total energy per access within +-5% of the target under the declared
# workload. This is the ONLY pass/fail gate; there are no soft gates.
hard_tolerance_relative = 0.05

# ===========================================================================
# Fig.18 power-breakdown shares (calibration targets; validation breakdown not gated)
# ===========================================================================
# [simulated p210 Fig.18] The paper's simulated whole-macro pie (percent of the
# 5.13 mW total). Calibration uses the paired slices and TMCSA share to determine
# otherwise-unpublished effective parameters. Validation still gates only the
# total; its per-slice rows remain informational because the paper does not
# publish the internal node voltages or enough accounting detail to reproduce
# every member boundary independently.
[fig18_shares]
control = 29.2
reference = 23.7
cablc = 14.9
dswct = 11.5
sinwp_sc = 8.0
pn_isub = 3.4
tmcsa = 9.3
read_path_sum = 47.1              # cablc + dswct + sinwp_sc + pn_isub + tmcsa

# ===========================================================================
# Declared conventions -- accounting basis
# ===========================================================================
[conventions]
# ADOPTED seats: the two peripherals not modeled from physics are seated to
# reproduce their [simulated p210] Fig.18 share -- Control 29.2 % and Reference
# 23.7 %, adopted rather than predicted. Their dyn/static SPLIT is
# [assumed], since the paper publishes none:
#   - Control: 70 % per-op dynamic and 30 % leakage at the reported 50 ns period.
#   - Reference: 100 % static (leakage).
adopt = ["control", "reference"]
control_dynamic_fraction = 0.70
control_static_fraction = 0.30
reference_static_fraction = 1.00
# READ-PATH seats: conduction follows the explicit circuit model under declared
# assumptions. Its static seats are declared small/zero. The activity
# probabilities, PN decision energy, and TMCSA conduction scale are [calibrated]
# to the paired-slice targets. CABLC, DSWCT, SINWP-SC, and
# PN-ISUB branch currents are never scaled after their explicit laws run.
# PAIRED-SLICE caliber: the model bills one series input branch across DSWCT and
# CABLC and one series sink branch across SINWP-SC and PN-ISUB. Fig.18 reports
# separate circuit-block shares, but the internal node voltages needed to
# reproduce that split are unpublished, so this campaign compares cablc+dswct
# (26.4 %) and sinwp_sc+pn_isub (11.4 %); tmcsa stays a single.
read_path = ["cablc", "dswct", "sinwp_sc", "pn_isub", "tmcsa"]
read_path_static_basis = "declared_small_or_zero"   # NOT residual-solved
# ENERGY basis: the profiler reports energy. Static/access = leakage_power
# * t_cycle (50 ns); dynamic/access = per-VMM dynamic / mux_factor; total/access =
# their sum. DSWCT / SINWP-SC have zero static seat.
static_time_base = "t_cycle"      # leakage integrates over the 50 ns period
dynamic_normalization = "per_vmm_over_mux_factor"

# ===========================================================================
# Data / workload conventions (the input + weight distribution to draw)
# ===========================================================================
[data]
weight_distribution = "zero_inflated_sign_magnitude_uniform_nonzero"
weight_range = [-3, 3]                     # [derived] 3-bit signed (sign + 2 magnitude digits)
weight_nonzero_probability = 1.0           # [calibrated] boundary solution: no zero weights
input_distribution = "zero_inflated_unsigned_uniform_nonzero"
input_range = [0, 3]                       # [derived] 2-bit unsigned
input_nonzero_probability = 0.2935         # [calibrated] among at most nine candidate rows per input
# [calibrated] Joint sweep against the two Fig.18 read-path conduction seats,
# with array capacitance and PN fixed switching excluded from the fit. The
# minimum-error point reaches the dense-weight boundary and averages about 2.64
# nonzero values among the nine candidates; nonzero magnitudes remain uniform.

# ===========================================================================
# Remaining open questions
# ===========================================================================
# Settled campaign choices remain tagged and explained next to their values in
# params.toml. This list contains only assumptions that require new physical
# evidence to replace; rerunning the same calibration cannot resolve them.
[open_questions]
notes = [
  "array node capacitances are unpublished, and the paired CABLC+DSWCT target leaves no positive residual at the calibrated workload -> the paper-reproduction preset declares them zero rather than claiming a physical extraction",
  "TMCSA PH2/PH3 durations are unpublished -> their assumed absolute windows remain fixed while one common conduction scale is calibrated",
]
