# Nonideality-free ("all-off") policy presets for the standard 1T1R /
# InterArraySlice topology (OpAmpTIA + GeneralDAC + McsSarAdc).
#
# Composed bottom-up via `_neurox_use_preset` so every switch is declared
# exactly once: `[macro]` pulls `[xbar]`, `[xbar].core.tia` pulls `[tia]`.
# Consumers reference the section matching the policy root they need:
#   - examples (macro)           -> "policy/all_off:macro"
#   - solver_calibrate (xbar)    -> "policy/all_off:xbar"
#   - xbar_tia (tia)             -> "policy/all_off:tia"

# --- op-amp TIA clamp-driver subtree ---

[tia]
_neurox_type = "OpAmpTIAPolicy"
opamp_gain_sigma = false

[tia.nmos]
A_vt_mismatch = false
A_beta_mismatch = false

# --- offset 1T1R xbar subtree (core + readout) ---

[xbar]
_neurox_type = "Offset1T1RXbarPolicy"

[xbar.core]
solve_chunk_size = 0

[xbar.core.rram]
prog_gamma = false
stuck_at = false
read_telegraph = false
read_thermal = false

[xbar.core.nmos]
A_vt_mismatch = false
A_beta_mismatch = false

[xbar.core.tia]
_neurox_use_preset = "policy/all_off:tia"

[xbar.core.sl_driver]
drive_thermal = false

[xbar.core.wl_dac]
_neurox_type = "GeneralDACPolicy"
drive_thermal = false

[xbar.readout]
_neurox_type = "OffsetSwitchCapMuxAdcReadOutPolicy"

[xbar.readout.signal_switchcap]
cap_mismatch = false
sampling_thermal_noise = false

[xbar.readout.ref_switchcap]
cap_mismatch = false
sampling_thermal_noise = false

[xbar.readout.analog_mux]
mux_gain_mismatch = false
mux_noise_cm = false
mux_noise_dm = false

[xbar.readout.bl_adc]
_neurox_type = "McsSarAdcPolicy"
cap_mismatch = false
comparator_offset = false
comparator_thermal_noise = false
sampling_thermal_noise = false

# --- inter-array-slice macro subtree ---

[macro]
_neurox_type = "InterArraySliceXbarMacroPolicy"

[macro.xbar]
_neurox_use_preset = "policy/all_off:xbar"
