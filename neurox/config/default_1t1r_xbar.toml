# Default 1T1R xbar configuration.

[xbar]
_neurox_type = "Offset1T1RXbarConfig"

# --- Tile size ---
col_num = 64
row_num = 64

# --- PPA ---
area_per_inst__um2 = 500.0
leakage_per_inst__uW = 5.0
latency_per_op__ns = 5.0

# --- Weight encoding ---
w_digit_count = 1
w_digit_radix = 2
w_state_offset = 1

# --- Reference-column scheme ---
ref_group_size = 16
ref_location = 8

# --- ADC operating point ---
adc_mode = 0
adc_bits = 4

[[xbar.output_rescale_factors]]
adc_mode = 0
adc_bits = 4
rf = 4.0625


[xbar.core_cfg]

# --- Pulse timing ---
wl_pulse_length__ns = 3.0

# --- SL topology ---
sl_topology = "row_shared"

# --- Layout pitch ---
row_first_space__um = 1.000
row_cell_space__um = 0.040
col_first_space__um = 1.000
col_cell_space__um = 0.040

# --- BL wire segments ---
bl_first_r__MOhm = 5e-6
bl_first_c__fF = 0.200
bl_segment_r__MOhm = 2e-7
bl_segment_c__fF = 0.008

# --- SL wire segments ---
sl_first_r__MOhm = 5e-6
sl_first_c__fF = 0.200
sl_segment_r__MOhm = 2e-7
sl_segment_c__fF = 0.008

# --- WL wire segments ---
wl_first_r__MOhm = 5e-6
wl_first_c__fF = 0.200
wl_segment_r__MOhm = 2e-7
wl_segment_c__fF = 0.008

# --- Access-NMOS sizing ---
access_nmos_W__um = 0.150
access_nmos_L__um = 0.028

# --- Access-NMOS parasitic-cap densities ---
c_gs_per_um__fF = 0.6396
c_gd_per_um__fF = 0.6396
c_db_per_um__fF = 0.85

# --- RRAM design window + state map ---
rram_g_max__uS = 100.0
state_to_g_map__uS = [10.0, 39.7, 69.7, 100.0]


[xbar.core_cfg.rram_cfg]
_neurox_use = "process/rram:rram_28_4state"

# --- Noise toggles ---
enable_read_thermal = false
enable_prog_gamma = false
enable_read_telegraph = false
enable_stuck_at = false


[xbar.core_cfg.nmos_cfg]
_neurox_use = "process/mos:nmos_28_rvt"

# --- Mismatch toggles ---
enable_A_vt_mismatch = false
enable_A_beta_mismatch = false


[xbar.core_cfg.tia_cfg]
_neurox_type = "OpAmpTIAConfig"

# --- Reference / supply ---
v_ref__V = 0.2
v_nmos_bias__V = 0.9
v_dd__V = 0.9

# --- Op-amp gain ---
opamp_gain = 30.0

# --- Op-amp gain mismatch ---
opamp_gain_sigma = 0.0
enable_opamp_gain_sigma = false

# --- Pseudo-resistor NMOS ---
pseudo_nmos_W__um = 1.000
pseudo_nmos_L__um = 0.060

# --- Output rail limiter ---
output_saturation_softness__V = 0.45

# --- PPA ---
leakage_per_inst__uW = 1.0
area_per_inst__um2 = 10.0
latency_per_op__ns = 2.0

[xbar.core_cfg.tia_cfg.nmos_cfg]
_neurox_use = "process/mos:nmos_28_rvt"

# --- Mismatch toggles ---
enable_A_vt_mismatch = false
enable_A_beta_mismatch = false


[xbar.core_cfg.sl_driver_cfg]

# --- Drive ---
drive_value = 0.0

# --- Drive thermal noise ---
drive_thermal__V = 0.0
enable_drive_thermal = false

# --- PPA ---
latency_per_op__ns = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0


[xbar.core_cfg.wl_decoder_cfg]
n_address_bits = 6
fanout = 4
drive_strength__uA = 1000.0
bit_serial = false
c_gate__fF = 0.5
v_dd__V = 1.2
t_gate__ns = 0.05
e_overhead__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0


[xbar.core_cfg.wl_dac_cfg]
_neurox_type = "GeneralDACConfig"

# --- LUT ---
code_to_signal = [0.0, 1.2]

# --- Drive thermal noise ---
drive_thermal__V = 0.0
enable_drive_thermal = false

# --- Energy / PPA ---
energy_per_op__fJ = 0.0
latency_per_op__ns = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0


[xbar.readout_cfg]
_neurox_type = "OffsetSwitchCapMuxAdcReadOutConfig"

# --- Energy / PPA ---
energy_per_op__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_cfg.data_switchcap_cfg]

# --- Unit capacitance ---
c_unit__fF = 5.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 0.005
enable_cap_mismatch = true

# --- Sampling thermal noise (kT/C) ---
enable_sampling_thermal_noise = false

# --- Energy / PPA ---
energy_per_sample_overhead__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_cfg.ref_switchcap_cfg]

# --- Unit capacitance ---
c_unit__fF = 5.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 0.005
enable_cap_mismatch = true

# --- Sampling thermal noise (kT/C) ---
enable_sampling_thermal_noise = false

# --- Energy / PPA ---
energy_per_sample_overhead__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_cfg.analog_mux_cfg]

# --- Gain ---
mux_gain = 1.0

# --- Common-mode noise ---
mux_noise_cm_sigma__V = 1e-3
enable_mux_noise_cm = true

# --- Differential-mode noise ---
mux_noise_dm_sigma__V = 1e-3
enable_mux_noise_dm = true

# --- Energy / PPA ---
energy_per_access__fJ = 0.0
leakage_per_inst__uW = 0.0
area_per_inst__um2 = 0.0
latency_per_op__ns = 0.0


[xbar.readout_cfg.adc_cfg]
_neurox_type = "McsSarAdcConfig"

# --- Topology ---
max_bits = 8

# --- References + timing ---
v_refs__V = [0.8, 0.4, 0.2]
clk_period__ns = 2.0

# --- CDAC unit ---
c_unit__fF = 2.0

# --- Cap mismatch (Pelgrom) ---
cap_mismatch_sigma_relative = 5e-3
enable_cap_mismatch = true

# --- Comparator static offset ---
comparator_offset_sigma__V = 3e-3
enable_comparator_offset = true

# --- Comparator thermal noise (per-cycle) ---
comparator_thermal_noise_sigma__V = 5e-4
enable_comparator_thermal_noise = true

# --- Sampling thermal noise (kT/C) ---
enable_sampling_thermal_noise = false

# --- Energy ---
e_bootstrap__fJ = 20.0
e_constant_per_bit__fJ = 12.0

# --- PPA ---
leakage_per_inst__uW = 0.5
area_per_inst__um2 = 250
