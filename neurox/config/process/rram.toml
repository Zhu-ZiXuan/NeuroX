# RRAM device parameters.
#
# Each top-level section names one variant: `<class>_<node>_<flavor>`
# where flavor encodes the cell behaviour (`4state` discrete, `binary`,
# `analog`, ...).
#
# Fields map directly to `RRAMConfig` field names; no construction
# directives (no `_neurox_*` keys of any kind).


[rram_28_4state]
state_to_g_map__uS = [10.0, 39.7, 69.7, 100.0]
nonlinearity_alpha = 0.5
drift_decay_rate = 0.03
drift_t0 = 1.0
c_top__fF = 0.1
c_bot__fF = 0.1
