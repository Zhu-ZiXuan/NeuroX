# Run config for neurox.tools.calibrate_adc.threshold_probe on this scheme.
#
# Probes the I_SUB(|M|) band grid of the tile built from
# params/default.toml (all-off policy) through the modeled read chain
# (core -> p/n mirrors -> subtractor, captured at the ADC input via the
# adc.convert probe channel) and places the mid-point threshold ladder
# per mode with the band-margin report. The emitted ref_levels__uA /
# i_refs__uA rows are pasted into params/default.toml (adc_config +
# reference_config, row index = adc_mode).
#
# The battery follows the scheme's documented calibration method
# (docs/works/macro/cim/isub_iadc_1t1r/reference/xbar.md): a
# deterministic single-cell-LSB count grid covering every per-phase |M|
# under full drive on a diluted column subset, count-capped random
# single-sign block patterns at full drive and moderate drive densities,
# and the fully-dense saturating extreme. The whole battery sits inside
# the workload envelope the nested DC solve converges on at the shipped
# electrical operating point (verified by the solver sweep's residual
# guard, log/calibration/solver_sweep_*.log).
#
# Run from the repo root:
#   python -m neurox.tools.calibrate_adc.threshold_probe \
#     --config neurox/works/macro/cim/isub_iadc_1t1r/params/calibrate_threshold.toml \
#     --device cuda:0 --output log/calibration/threshold_fragment.toml

# Mode set emitted by calibrate_modes.toml (mode_derive --output); one
# ladder per mode, m_max = ceil(range). The path resolves relative to
# this file (params/ -> repo root is six levels up).
modes_file = "../../../../../../log/calibration/adc_modes.toml"

[macro]
# Descending merge priority (first-wins deep merge; a geometry overlay
# may precede the scheme default).
config_files = ["default.toml"]
config_section = "cim_macro"
policy_file = "../policy/all_off.toml"
policy_section = "policy"

[probe]
# Capture operating point; the analog I_SUB is mode-independent (mode
# selection is quasi-static reference switching inside the quantizer).
adc_mode = 0

[stimulus]
seed = 0
# Per-(column, phase)-block magnitude caps of the random battery, spanning
# the linear band up to the 5-bit saturation code.
lsb_caps = [7, 15, 23, 31]
patterns_per_cap = 2
x_densities = [0.25, 0.5]
# Full-drive exact-count elements for every cap (the whole all-column
# loading range converges at the shipped operating point).
full_drive_caps = [7, 15, 23, 31]
x_batch = 4
# Every 8th column programmed in the exact-coverage grid (32 grid columns
# -> full 0..31 coverage in one pattern); the dilution keeps the grid's
# total conduction representative of deployment column loading.
grid_col_stride = 8
# The fully-dense saturating extreme converges at the shipped operating
# point (see the solver sweep) and bounds the top band.
include_saturating = true
