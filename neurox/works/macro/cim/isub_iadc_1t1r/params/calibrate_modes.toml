# Run config for neurox.tools.calibrate_adc.mode_derive on this scheme.
#
# Derives the ADC operating-mode set for the TTFS-BERT deployment from
# the per-layer range mapping file (per-layer design range + signedness;
# format owned by neurox.tools.calibrate_adc._modes). Producing the
# mapping file from the hardware_comparable checkpoint's learned
# `adc_clip_range` scalars is a consumer-side extraction step. Layers
# partition by their `signed` flag (unsigned group first, then signed);
# ranges cluster per group by deterministic 1-D relative-gap
# agglomeration. Output: the mode-set TOML consumed by
# calibrate_threshold.toml and calibrate_rescale.toml, plus a cluster
# plot.
#
# Run from the repo root:
#   python -m neurox.tools.calibrate_adc.mode_derive \
#     --config neurox/works/macro/cim/isub_iadc_1t1r/params/calibrate_modes.toml \
#     --output log/calibration/adc_modes.toml

# hardware_comparable/ is a repo-root symlink; the path resolves relative
# to this file (params/ -> repo root is six levels up).
mapping_file = "../../../../../../hardware_comparable/ckpt_6bit/adc_layer_ranges.toml"

[cluster]
rel_tol = 0.05
max_modes_per_group = 4
