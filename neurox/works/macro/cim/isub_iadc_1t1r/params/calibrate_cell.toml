# Run config for neurox.tools.calibrate_cell on this scheme.
#
# Calibrates the Detail cell's access-node condensation count (n_newton
# step-ratio plateau + margin) and extracts the linearized-cell secant
# fragment at the scheme's nominal read point: BL clamped at V_BLC (the
# clamp_ref_config tap 0, 0.3 V), SL driven to ground (tap 1, 0.0 V), WL
# swung between the 1-bit WL DAC levels (0.0 / 0.9 V). The terminal grid
# spans the read-voltage range plus headroom around V_BLC.
#
# Run from the repo root:
#   python -m neurox.tools.calibrate_cell._1t1r \
#     --config neurox/works/macro/cim/isub_iadc_1t1r/params/calibrate_cell.toml \
#     --output-dir log/calibration/calibrate_cell_isub/ \
#     --device cpu

[cell_config]
_neurox_use = "default.toml:cim_macro.array_config.cell_config"


# Representative operating grid the array solver drives the cell over:
# v_bl / v_sl swept independently over [0.0, 0.4] V (full n_terminal^2
# outer product), WL off / on at the scheme's 1-bit DAC levels, every
# programmed RRAM state (added automatically). v_bl_op / v_sl_op anchor
# the linearized-cell secant extraction at the nominal read point.
[grid]
v_terminal_min__V = 0.0
v_terminal_max__V = 0.4
n_terminal = 8
v_wl_off__V = 0.0
v_wl_on__V = 0.9
v_bl_op__V = 0.3
v_sl_op__V = 0.0


# Candidate counts to sweep, plus the plateau detector criteria; the fp64
# step plateau needs the list to extend well past the shipped count.
# margin adds this many iterations to the picked count for safety.
[sweep]
candidates = [1, 2, 3, 4, 5, 6, 7, 8]
ratio_threshold = 0.5
reltol = 1e-2
margin = 1


# fp64 is the calibration default: the per-cell condensation is cheap and
# the round-off floor is the quantity being characterised.
[runtime]
dtype = "float64"
